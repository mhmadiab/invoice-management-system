    get:
      tags:
      - Payments
      summary: Get invoice payment history
      operationId: getInvoicePayments
      description: |
        Returns the complete payment history for an invoice together with its current payment summary.

        Related Functional Requirements:
        - FR-050: Display complete payment history for an invoice.
        - FR-051: Display the invoice remaining balance.

        Payment history is retained even if the invoice is later cancelled.
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Invoice payment history retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - invoice
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - invoiceId
                      - amount
                      - paymentDate
                      - method
                      - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                        invoiceId:
                          type: string
                          format: uuid
                          readOnly: true
                        amount:
                          type: number
                          format: double
                          exclusiveMinimum: 0
                          readOnly: true
                        paymentDate:
                          type: string
                          format: date
                          readOnly: true
                        method:
                          type: string
                          description: "Supported V1 payment method, based on FR-046."
                          enum:
                          - cash
                          - bank_transfer
                          - cheque
                          - card
                          examples:
                          - bank_transfer
                        createdAt:
                          type: string
                          format: date-time
                          readOnly: true
                  invoice:
                    type: object
                    additionalProperties: false
                    required:
                    - total
                    - paidAmount
                    - remainingBalance
                    - status
                    properties:
                      total:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      paidAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      remainingBalance:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      status:
                        type: string
                        description: |
                          Current invoice lifecycle/payment status.

                          - `draft`: Invoice is being prepared.
                          - `issued`: Invoice has been finalized and issued.
                          - `partially_paid`: At least one payment has been recorded, but a balance remains.
                          - `overdue`: Invoice is past its due date and still has an outstanding balance.
                          - `paid`: Remaining balance is zero.
                          - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
                          - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
                        enum:
                        - draft
                        - issued
                        - partially_paid
                        - overdue
                        - paid
                        - cancelled
                        - void
                        examples:
                        - issued
                  pagination:
                    type: object
                    additionalProperties: false
                    required:
                    - page
                    - pageSize
                    - totalItems
                    - totalPages
                    properties:
                      page:
                        type: integer
                        minimum: 1
                        description: Current page number.
                        examples:
                        - 1
                      pageSize:
                        type: integer
                        minimum: 1
                        description: Number of items requested per page.
                        examples:
                        - 20
                      totalItems:
                        type: integer
                        minimum: 0
                        description: Total number of matching records.
                        examples:
                        - 45
                      totalPages:
                        type: integer
                        minimum: 0
                        description: Total number of pages.
                        examples:
                        - 3
                    examples:
                    - page: 1
                      pageSize: 20
                      totalItems: 45
                      totalPages: 3
