components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token used to access protected endpoints.

        Include the token in the HTTP Authorization header:

        Authorization: Bearer <access-token>
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Registered administrator email address.
          examples:
          - admin@example.com
        password:
          type: string
          format: password
          minLength: 1
          description: Administrator password.
          examples:
          - StrongPassword123!
      examples:
      - email: admin@example.com
        password: StrongPassword123!
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      - administrator
      properties:
        accessToken:
          type: string
          minLength: 1
          description: |
            Short-lived JWT access token used to authorize protected
            API operations.
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          const: Bearer
          description: Authentication scheme used with the access token.
          examples:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Number of seconds until the access token expires.
          examples:
          - 900
        administrator:
          type: object
          additionalProperties: false
          required:
          - id
          - email
          properties:
            id:
              type: string
              format: uuid
              description: Unique administrator identifier.
              examples:
              - 8dca55b1-dc27-46fa-a15f-23f187807832
            email:
              type: string
              format: email
              description: Authenticated administrator email address.
              examples:
              - admin@example.com
          examples:
          - id: 8dca55b1-dc27-46fa-a15f-23f187807832
            email: admin@example.com
      examples:
      - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType: Bearer
        expiresIn: 900
        administrator:
          id: 8dca55b1-dc27-46fa-a15f-23f187807832
          email: admin@example.com
    AuthenticatedAdministrator:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      properties:
        id:
          type: string
          format: uuid
          description: Unique administrator identifier.
          examples:
          - 8dca55b1-dc27-46fa-a15f-23f187807832
        email:
          type: string
          format: email
          description: Authenticated administrator email address.
          examples:
          - admin@example.com
      examples:
      - id: 8dca55b1-dc27-46fa-a15f-23f187807832
        email: admin@example.com
    TokenRefreshResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Newly generated JWT access token.
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          const: Bearer
          examples:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds.
          examples:
          - 900
      examples:
      - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType: Bearer
        expiresIn: 900
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP error status code.
          examples:
          - 401
        code:
          type: string
          minLength: 1
          description: |
            Stable machine-readable error code that can be used
            by frontend application logic.
          examples:
          - INVALID_CREDENTIALS
        message:
          type: string
          minLength: 1
          description: Human-readable error description.
          examples:
          - Invalid email or password.
      examples:
      - status: 401
        code: INVALID_CREDENTIALS
        message: Invalid email or password.
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      - errors
      properties:
        status:
          type: integer
          const: 400
          examples:
          - 400
        code:
          type: string
          const: VALIDATION_ERROR
          examples:
          - VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          examples:
          - The request contains invalid data.
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
                minLength: 1
                description: Request field that failed validation.
                examples:
                - email
              message:
                type: string
                minLength: 1
                description: Explanation of the validation failure.
                examples:
                - A valid email address is required.
            examples:
            - field: email
              message: A valid email address is required.
      examples:
      - status: 400
        code: VALIDATION_ERROR
        message: The request contains invalid data.
        errors:
        - field: email
          message: A valid email address is required.
    FieldValidationError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
          minLength: 1
          description: Request field that failed validation.
          examples:
          - email
        message:
          type: string
          minLength: 1
          description: Explanation of the validation failure.
          examples:
          - A valid email address is required.
      examples:
      - field: email
        message: A valid email address is required.
