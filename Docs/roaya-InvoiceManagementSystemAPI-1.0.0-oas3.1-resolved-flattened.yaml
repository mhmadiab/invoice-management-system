          type: object
          additionalProperties: false
          required:
          - page
          - pageSize
          - totalItems
          - totalPages
          properties:
            page:
              type: integer
              minimum: 1
              description: Current page number.
              examples:
              - 1
            pageSize:
              type: integer
              minimum: 1
              description: Number of items requested per page.
              examples:
              - 20
            totalItems:
              type: integer
              minimum: 0
              description: Total number of matching records.
              examples:
              - 45
            totalPages:
              type: integer
              minimum: 0
              description: Total number of pages.
              examples:
              - 3
          examples:
