  /customers/{customerId}/archive:
    post:
      tags:
      - Customers
      summary: Archive customer
      operationId: archiveCustomer
      description: |
        Archives an active customer without deleting historical data.

        Related Functional Requirements:
        - FR-014: Archived customers are excluded from active customer
        selection and active customer counts while preserving history.
        - FR-015: A customer with active unpaid invoices cannot be archived.

        Business rules:
        - The customer must belong to the authenticated business.
        - Archiving is a state transition, not deletion.
        - Customer invoices, contracts, payments, and historical data
        are preserved.
        - Customers with active unpaid invoices cannot be archived.
        - Archived customers are excluded from active customer selections.
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer to archive.
        schema:
          type: string
          format: uuid
        examples:
          customerId:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
      responses:
        "200":
          description: Customer archived successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - name
                    - email
                    - type
                    - status
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
