  /customers/{customerId}/unarchive:
    post:
      tags:
      - Customers
      summary: Unarchive customer
      operationId: unarchiveCustomer
      description: |
        Restores an archived customer to active status.

        Business rules:
        - Only an archived customer can be unarchived.
        - Unarchiving changes the customer status from `archived` to `active`.
        - Existing invoices, payments, contracts, and historical records remain unchanged.
        - The restored customer becomes available again in active customer
        selection lists and is included in the active customer count.
        - This operation does not create a new customer record.
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer to unarchive.
        schema:
          type: string
          format: uuid
        examples:
          customer:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
