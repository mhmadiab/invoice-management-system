    get:
      tags:
      - Invoices
      summary: List and search invoices
      operationId: listInvoices
      description: |
        Returns invoices belonging to the authenticated business.

        Related Functional Requirements:
        - FR-062: Search by invoice number.
        - FR-063: Search/filter by customer.
        - FR-064: Filter by invoice status.
        - FR-065: Filter invoices by issue-date range.

        Filters can be combined.
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceNumber
        in: query
        required: false
        description: Search by invoice number.
        schema:
          type: string
          minLength: 1
          maxLength: 100
        examples:
          invoiceNumber:
            value: INV-1001
      - name: customerId
        in: query
        required: false
        description: Filter invoices by customer.
        schema:
          type: string
          format: uuid
        examples:
          customer:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
      - name: status
        in: query
        required: false
        description: Filter invoices by lifecycle/payment status.
        schema:
          type: string
          description: |
            Current invoice lifecycle/payment status.

            - `draft`: Invoice is being prepared.
            - `issued`: Invoice has been finalized and issued.
            - `partially_paid`: At least one payment has been recorded, but a balance remains.
            - `overdue`: Invoice is past its due date and still has an outstanding balance.
            - `paid`: Remaining balance is zero.
            - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
            - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
          enum:
          - draft
          - issued
          - partially_paid
          - overdue
          - paid
          - cancelled
          - void
          examples:
          - issued
        examples:
          issued:
            value: issued
      - name: issueDateFrom
        in: query
        required: false
        description: Include invoices issued on or after this date.
        schema:
          type: string
          format: date
        examples:
          fromDate:
            value: 2026-09-01
      - name: issueDateTo
        in: query
        required: false
        description: Include invoices issued on or before this date.
        schema:
          type: string
          format: date
        examples:
          toDate:
            value: 2026-09-30
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of invoices returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
