  /customers/{customerId}/contracts:
    get:
      tags:
      - Contracts
      summary: Get customer contracts
      operationId: getCustomerContracts
      description: |
        Returns contracts associated with a specific customer.

        Related Functional Requirement:
        - FR-022: Each contract belongs to exactly one customer.

        This supporting endpoint allows the customer detail workflow
        to display contracts belonging to the selected customer.
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer.
        schema:
          type: string
          format: uuid
        examples:
          customerId:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
      - name: status
        in: query
        required: false
        description: Filter the customer's contracts by status.
        schema:
          type: string
          description: |
            Current contract lifecycle status.

            - `draft`: Contract is being prepared.
            - `pending_approval`: Contract is awaiting approval.
            - `active`: Contract is currently active.
            - `completed`: Contract has been completed.
            - `cancelled`: Contract has been cancelled.
            - `archived`: Contract is retained for historical purposes and
            excluded from active contract lists and expiration notifications.
          enum:
          - draft
          - pending_approval
          - active
          - completed
          - cancelled
          examples:
          - active
        examples:
          activeContracts:
            value: active
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of contracts returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
