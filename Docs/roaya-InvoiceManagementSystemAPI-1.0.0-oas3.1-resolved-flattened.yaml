openapi: 3.1.0
info:
  title: Invoice Management System API
  version: 1.0.0-oas3.1
  description: |-
    REST API for the Invoice Management System.

    Authentication architecture:
    - Short-lived JWT access tokens.
    - Server-side refresh sessions.
    - Secure HttpOnly refresh-token cookies.
    - Session revocation on logout.
    - 30-minute inactivity timeout.
    - Administrator passwords stored using bcrypt.

    API design note:
    This document combines the Swagger/OpenAPI modules designed so far: Authentication, Customers, Contracts, Invoices, Payments, Reminders, Dashboard, Reports, Settings, and Administrator Notifications.
    Deletion policy: V1 does not expose hard-delete operations for business and financial resources. Historical records must be preserved for traceability and financial consistency.
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Authentication
  description: Administrator authentication and session management.
- name: Customers
  description: "Customer creation, retrieval, modification, archiving, searching, and invoice history."
- name: Contracts
  description: "Contract creation, retrieval, modification, archiving, and customer contract history."
- name: Invoices
  description: "Invoice draft creation, retrieval, modification, issuing, cancellation, PDF generation, delivery, searching, and filtering."
- name: Payments
  description: "Payment recording, invoice payment history, balance tracking, and payment reporting."
- name: Reminders
  description: "Reminder configuration, automated customer reminders, and invoice reminder history."
- name: Dashboard
  description: "Aggregated business metrics, overdue invoices, upcoming due invoices, and recent business activity."
- name: Reports
  description: "Read-only financial reporting for invoices, payments, outstanding balances, overdue amounts, and customer balances."
- name: Settings
  description: "Business profile, invoice configuration, notification preferences, and email template management."
- name: Notifications
  description: "Administrator notification history generated by critical invoice, payment, and contract events."
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate administrator
      operationId: loginAdministrator
      description: |
        Authenticates an administrator using a registered email address
        and password.

        Related Functional Requirements:
        - FR-001: Administrator can log in using registered email/password.
        - FR-002: Invalid credentials return a generic response.
        - FR-003: Account is locked after 5 consecutive failed login attempts
        for 15 minutes.

        Security and business rules:
        - The password is compared with its stored bcrypt hash.
        - The response must not reveal whether the email or password was wrong.
        - Failed login attempts are tracked.
        - Successful authentication resets the failed-attempt counter.
        - A successful login creates a server-side refresh session.
        - The access token is intentionally short-lived.
        - The refresh token is not exposed in the JSON response.
        - The refresh token is stored in a Secure HttpOnly cookie.
      security: []
      requestBody:
        required: true
        description: Administrator authentication credentials.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Registered administrator email address.
                  examples:
                  - admin@example.com
                password:
                  type: string
                  format: password
                  minLength: 1
                  description: Administrator password.
                  examples:
                  - StrongPassword123!
              examples:
              - email: admin@example.com
                password: StrongPassword123!
            examples:
              validLogin:
                summary: Valid administrator credentials
                value:
                  email: admin@example.com
                  password: StrongPassword123!
      responses:
        "200":
          description: Administrator authenticated successfully.
          headers:
            Set-Cookie:
              description: |
                Stores the refresh token in a Secure HttpOnly cookie.

                Recommended cookie configuration:
                - HttpOnly
                - Secure
                - SameSite=Strict
                - Path=/api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accessToken
                - tokenType
                - expiresIn
                - administrator
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                    description: |
                      Short-lived JWT access token used to authorize protected
                      API operations.
                    examples:
                    - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType:
                    type: string
                    const: Bearer
                    description: Authentication scheme used with the access token.
                    examples:
                    - Bearer
                  expiresIn:
                    type: integer
                    minimum: 1
                    description: |
                      Number of seconds until the access token expires.
                    examples:
                    - 900
                  administrator:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - email
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique administrator identifier.
                        examples:
                        - 8dca55b1-dc27-46fa-a15f-23f187807832
                      email:
                        type: string
                        format: email
                        description: Authenticated administrator email address.
                        examples:
                        - admin@example.com
                    examples:
                    - id: 8dca55b1-dc27-46fa-a15f-23f187807832
                      email: admin@example.com
                examples:
                - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType: Bearer
                  expiresIn: 900
                  administrator:
                    id: 8dca55b1-dc27-46fa-a15f-23f187807832
                    email: admin@example.com
              examples:
                successfulLogin:
                  summary: Successful administrator login
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
                    administrator:
                      id: 8dca55b1-dc27-46fa-a15f-23f187807832
                      email: admin@example.com
        "400":
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                - errors
                properties:
                  status:
                    type: integer
                    const: 400
                    examples:
                    - 400
                  code:
                    type: string
                    const: VALIDATION_ERROR
                    examples:
                    - VALIDATION_ERROR
                  message:
                    type: string
                    minLength: 1
                    examples:
                    - The request contains invalid data.
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - field
                      - message
                      properties:
                        field:
                          type: string
                          minLength: 1
                          description: Request field that failed validation.
                          examples:
                          - email
                        message:
                          type: string
                          minLength: 1
                          description: Explanation of the validation failure.
                          examples:
                          - A valid email address is required.
                      examples:
                      - field: email
                        message: A valid email address is required.
                examples:
                - status: 400
                  code: VALIDATION_ERROR
                  message: The request contains invalid data.
                  errors:
                  - field: email
                    message: A valid email address is required.
              examples:
                invalidEmail:
                  summary: Invalid email address
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: The request contains invalid data.
                    errors:
                    - field: email
                      message: A valid email address is required.
        "401":
          description: Authentication failed because the credentials are invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                invalidCredentials:
                  summary: Invalid email or password
                  value:
                    status: 401
                    code: INVALID_CREDENTIALS
                    message: Invalid email or password.
        "423":
          description: |
            The administrator account is temporarily locked because
            five consecutive failed login attempts were reached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                accountLocked:
                  summary: Account temporarily locked
                  value:
                    status: 423
                    code: ACCOUNT_LOCKED
                    message: Account temporarily locked. Try again later.
        "500":
          description: An unexpected server-side error occurred.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                unexpectedError:
                  summary: Unexpected server error
                  value:
                    status: 500
                    code: INTERNAL_SERVER_ERROR
                    message: An unexpected error occurred.
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh access token
      operationId: refreshAccessToken
      description: |
        Issues a new short-lived JWT access token using the current
        refresh session.

        This endpoint is an implementation requirement of the selected
        JWT + refresh-session authentication architecture.

        The refresh token is expected to be stored in a Secure HttpOnly
        cookie and therefore is not supplied in the JSON request body.

        Before issuing a new access token, the server validates:
        - The refresh token.
        - The associated server-side session.
        - Whether the session has been revoked.
        - Whether the session has expired.
        - Whether the 30-minute inactivity timeout has been exceeded.
        - Whether the administrator still exists and is allowed to authenticate.
      security: []
      responses:
        "200":
          description: A new access token was issued successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - accessToken
                - tokenType
                - expiresIn
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                    description: Newly generated JWT access token.
                    examples:
                    - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType:
                    type: string
                    const: Bearer
                    examples:
                    - Bearer
                  expiresIn:
                    type: integer
                    minimum: 1
                    description: Access-token lifetime in seconds.
                    examples:
                    - 900
                examples:
                - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType: Bearer
                  expiresIn: 900
              examples:
                refreshedAccessToken:
                  summary: Successfully refreshed access token
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
        "401":
          description: |
            The refresh token or associated authentication session
            is invalid, revoked, expired, or inactive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                invalidSession:
                  summary: Invalid or revoked session
                  value:
                    status: 401
                    code: INVALID_SESSION
                    message: Authentication session is invalid or expired.
                sessionExpired:
                  summary: Session expired after inactivity
                  value:
                    status: 401
                    code: SESSION_EXPIRED
                    message: Authentication session is invalid or expired.
        "500":
          description: An unexpected server-side error occurred.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                unexpectedError:
                  summary: Unexpected server error
                  value:
                    status: 500
                    code: INTERNAL_SERVER_ERROR
                    message: An unexpected error occurred.
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out current administrator
      operationId: logoutAdministrator
      description: |
        Logs out the currently authenticated administrator.

        Related Functional Requirement:
        - FR-004: Logout invalidates the current session/token.

        Logout processing:
        - The server identifies the current authenticated session.
        - The server revokes the refresh session.
        - The refresh-token cookie is cleared.
        - The revoked refresh session can no longer issue access tokens.

        Existing short-lived access tokens may remain cryptographically valid
        until expiration unless access-token revocation is implemented
        separately. The server-side refresh session prevents creation of
        additional tokens after logout.
      security:
      - bearerAuth: []
      responses:
        "204":
          description: Administrator logged out successfully.
          headers:
            Set-Cookie:
              description: |
                Clears the refresh-token cookie.
              schema:
                type: string
        "401":
          description: |
            Authentication is required or the supplied access token
            is missing, invalid, or expired.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                missingAuthentication:
                  summary: Authentication required
                  value:
                    status: 401
                    code: UNAUTHORIZED
                    message: Authentication required.
                expiredAccessToken:
                  summary: Access token expired
                  value:
                    status: 401
                    code: ACCESS_TOKEN_EXPIRED
                    message: Access token has expired.
        "500":
          description: An unexpected server-side error occurred.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                unexpectedError:
                  summary: Unexpected server error
                  value:
                    status: 500
                    code: INTERNAL_SERVER_ERROR
                    message: An unexpected error occurred.
  /customers:
    post:
      tags:
      - Customers
      summary: Create customer
      operationId: createCustomer
      description: |
        Creates a new customer for the authenticated business.

        Related Functional Requirement:
        - FR-012: Create a customer with name, email, phone, and
        billing address.
        - Customer name and email are required.
        - Duplicate customer email addresses are rejected.

        Business rules:
        - The customer is automatically associated with the
        authenticated administrator's business.
        - A newly created customer has status `active`.
        - Customer email must be unique within the business.
        - Name cannot be empty.
        - Email must be a valid email address.
        - Phone and billing address are optional.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Customer information.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - email
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Customer's full name or organization name.
                  examples:
                  - John Smith
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: |
                    Customer email address.

                    The email must be unique within the authenticated business.
                  examples:
                  - john.smith@example.com
                phone:
                  type:
                  - string
                  - "null"
                  maxLength: 50
                  description: Optional customer phone number.
                  examples:
                  - "+96170123456"
                billingAddress:
                  type:
                  - string
                  - "null"
                  maxLength: 500
                  description: Optional customer billing address.
                  examples:
                  - "Beirut, Lebanon"
                type:
                  type: string
                  description: |
                    Type of customer.

                    - `individual`: An individual person.
                    - `organization`: A company, corporate entity, or professional group.
                  enum:
                  - individual
                  - organization
                  examples:
                  - individual
              examples:
              - name: John Smith
                email: john.smith@example.com
                phone: "+96170123456"
                billingAddress: "Beirut, Lebanon"
                type: individual
            examples:
              individualCustomer:
                summary: Create an individual customer
                value:
                  name: John Smith
                  email: john.smith@example.com
                  phone: "+96170123456"
                  billingAddress: "Beirut, Lebanon"
                  type: individual
              organizationCustomer:
                summary: Create an organization customer
                value:
                  name: Example Technology SAL
                  email: accounting@example.com
                  phone: "+9611123456"
                  billingAddress: "Beirut Digital District, Beirut, Lebanon"
                  type: organization
      responses:
        "201":
          description: Customer created successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - name
                    - email
                    - type
                    - status
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        description: Unique customer identifier.
                        examples:
                        - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      name:
                        type: string
                        minLength: 1
                        maxLength: 200
                        description: Customer's full name or organization name.
                        examples:
                        - John Smith
                      email:
                        type: string
                        format: email
                        maxLength: 254
                        description: |
                          Customer email address used for communication,
                          invoice delivery, and reminders.
                        examples:
                        - john.smith@example.com
                      phone:
                        type:
                        - string
                        - "null"
                        maxLength: 50
                        description: Optional customer phone number.
                        examples:
                        - "+96170123456"
                      billingAddress:
                        type:
                        - string
                        - "null"
                        maxLength: 500
                        description: Optional customer billing address.
                        examples:
                        - "Beirut, Lebanon"
                      type:
                        type: string
                        description: |
                          Type of customer.

                          - `individual`: An individual person.
                          - `organization`: A company, corporate entity, or professional group.
                        enum:
                        - individual
                        - organization
                        examples:
                        - individual
                      status:
                        type: string
                        description: |
                          Current customer lifecycle status.

                          - `active`: Customer is available for active business operations.
                          - `archived`: Customer is retained for historical purposes but
                          excluded from active selections.
                        enum:
                        - active
                        - archived
                        examples:
                        - active
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date and time when the customer was created.
                        examples:
                        - 2026-09-01T10:30:00Z
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date and time when the customer was last modified.
                        examples:
                        - 2026-09-01T12:15:00Z
                    examples:
                    - id: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      name: John Smith
                      email: john.smith@example.com
                      phone: "+96170123456"
                      billingAddress: "Beirut, Lebanon"
                      type: individual
                      status: active
                      createdAt: 2026-09-01T10:30:00Z
                      updatedAt: 2026-09-01T12:15:00Z
                examples:
                - data:
                    id: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                    name: John Smith
                    email: john.smith@example.com
                    phone: "+96170123456"
                    billingAddress: "Beirut, Lebanon"
                    type: individual
                    status: active
                    createdAt: 2026-09-01T10:30:00Z
                    updatedAt: 2026-09-01T10:30:00Z
              examples:
                customerCreated:
                  summary: Successfully created customer
                  value:
                    data:
                      id: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      name: John Smith
                      email: john.smith@example.com
                      phone: "+96170123456"
                      billingAddress: "Beirut, Lebanon"
                      type: individual
                      status: active
                      createdAt: 2026-09-01T10:30:00Z
                      updatedAt: 2026-09-01T10:30:00Z
        "400":
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                - errors
                properties:
                  status:
                    type: integer
                    const: 400
                    examples:
                    - 400
                  code:
                    type: string
                    const: VALIDATION_ERROR
                    examples:
                    - VALIDATION_ERROR
                  message:
                    type: string
                    minLength: 1
                    examples:
                    - The request contains invalid data.
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - field
                      - message
                      properties:
                        field:
                          type: string
                          minLength: 1
                          description: Request field that failed validation.
                          examples:
                          - email
                        message:
                          type: string
                          minLength: 1
                          description: Explanation of the validation failure.
                          examples:
                          - A valid email address is required.
                      examples:
                      - field: email
                        message: A valid email address is required.
                examples:
                - status: 400
                  code: VALIDATION_ERROR
                  message: The request contains invalid data.
                  errors:
                  - field: email
                    message: A valid email address is required.
              examples:
                invalidEmail:
                  summary: Invalid email address
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: The request contains invalid data.
                    errors:
                    - field: email
                      message: A valid email address is required.
        "401":
          description: |
            Authentication is required or the supplied access token
            is missing, invalid, or expired.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                properties:
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                    description: HTTP error status code.
                    examples:
                    - 401
                  code:
                    type: string
                    minLength: 1
                    description: |
                      Stable machine-readable error code that can be used
                      by frontend application logic.
                    examples:
                    - INVALID_CREDENTIALS
                  message:
                    type: string
                    minLength: 1
                    description: Human-readable error description.
                    examples:
                    - Invalid email or password.
                examples:
                - status: 401
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
              examples:
                missingAuthentication:
                  summary: Authentication required
                  value:
                    status: 401
