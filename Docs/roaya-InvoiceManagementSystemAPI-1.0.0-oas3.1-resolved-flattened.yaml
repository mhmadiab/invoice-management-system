                        - "null"
                        format: date
                        readOnly: true
                        description: Server-assigned issue date; null while draft.
                        examples:
                        - 2026-09-01
                      dueDate:
                        type: string
                        format: date
                        examples:
                        - 2026-10-01
                      status:
                        type: string
                        description: |
                          Current invoice lifecycle/payment status.

                          - `draft`: Invoice is being prepared.
                          - `issued`: Invoice has been finalized and issued.
                          - `partially_paid`: At least one payment has been recorded, but a balance remains.
                          - `overdue`: Invoice is past its due date and still has an outstanding balance.
                          - `paid`: Remaining balance is zero.
                          - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
                          - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
                        enum:
                        - draft
                        - issued
                        - partially_paid
                        - overdue
                        - paid
                        - cancelled
                        - void
                        examples:
                        - issued
                      items:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - id
                          - description
                          - quantity
                          - unitPrice
                          - lineTotal
                          properties:
                            id:
                              type: string
                              format: uuid
                              readOnly: true
                              examples:
                              - 7d843ebc-2d87-4664-9845-a38c89cb3d73
                            description:
                              type: string
                              examples:
                              - Backend development
                            quantity:
                              type: number
                              exclusiveMinimum: 0
                              examples:
                              - 10
                            unitPrice:
                              type: number
                              format: double
                              minimum: 0
                              examples:
                              - 100
                            lineTotal:
                              type: number
                              format: double
                              minimum: 0
                              readOnly: true
                              description: Server-calculated quantity multiplied by unit price.
                              examples:
                              - 1000
                      subtotal:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Sum of line totals before discount and tax.
                        examples:
                        - 1500
                      discountType:
                        oneOf:
                        - type: string
                          description: Type of discount applied before tax.
                          enum:
                          - percentage
                          - fixed
                          examples:
                          - percentage
                        - type: "null"
                        readOnly: true
                      discountValue:
                        type:
                        - number
                        - "null"
                        format: double
                        minimum: 0
                        readOnly: true
                        examples:
                        - 10
                      discountAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Server-calculated monetary discount amount.
                        examples:
                        - 150
                      taxRate:
                        type: number
                        format: double
                        minimum: 0
                        description: Tax percentage applicable to the invoice.
                        examples:
                        - 11
                      taxAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Server-calculated tax amount after discount.
                        examples:
                        - 148.5
                      total:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Final invoice total after discount and tax.
                        examples:
                        - 1498.5
                      paidAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Sum of payments recorded against the invoice.
                        examples:
