    get:
      tags:
      - Contracts
      summary: List contracts
      operationId: listContracts
      description: |
        Returns contracts belonging to the authenticated business.

        Contracts can be filtered by customer, lifecycle status,
        and archive state.

        Archived contracts are excluded by default and can be
        explicitly requested using the `archived` filter.
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: query
        required: false
        description: Return contracts belonging to a specific customer.
        schema:
          type: string
          format: uuid
        examples:
          customer:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
      - name: status
        in: query
        required: false
        description: Filter contracts by lifecycle status.
        schema:
          type: string
          description: |
            Current contract lifecycle status.

            - `draft`: Contract is being prepared.
            - `pending_approval`: Contract is awaiting approval.
            - `active`: Contract is currently active.
            - `completed`: Contract has been completed.
            - `cancelled`: Contract has been cancelled.
            - `archived`: Contract is retained for historical purposes and
            excluded from active contract lists and expiration notifications.
          enum:
          - draft
          - pending_approval
          - active
          - completed
          - cancelled
          examples:
          - active
        examples:
          activeContracts:
            value: active
      - name: archived
        in: query
        required: false
        description: |
          Filter contracts by archive state.
          When omitted, archived contracts are excluded by default.
          Set to true to return archived contracts.
          Set to false to return non-archived contracts.
        schema:
          type: boolean
          default: false
        examples:
          archivedContracts:
            value: true
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of contracts returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      responses:
