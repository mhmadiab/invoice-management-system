  /invoices/{invoiceId}/cancel:
    post:
      tags:
      - Invoices
      summary: Cancel issued invoice
      operationId: cancelInvoice
      description: |
        Cancels an issued invoice that has not been fully paid.

        Related Functional Requirement:
        - FR-030: Cancel an issued invoice that is not fully paid, preserve its payment history, and exclude it from outstanding balances and reminders.

        Business rules:
        - Draft invoices are not cancelled through this operation.
        - Fully paid invoices cannot be cancelled.
        - Existing payments are preserved.
        - No refund is created.
        - Cancelled invoices are excluded from outstanding balances.
        - Future reminders for the invoice are stopped.
        - Cancellation does not delete the invoice.
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice to cancel.
        schema:
          type: string
