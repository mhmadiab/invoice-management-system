  /invoices/{invoiceId}/payments:
    post:
      tags:
      - Payments
      summary: Record invoice payment
      operationId: createInvoicePayment
      description: |
        Records a payment against an existing invoice.

        Related Functional Requirements:
        - FR-046: Record a payment with invoice, amount, payment date, and payment method.
        - FR-047: Support partial payments.
        - FR-048: Calculate the remaining balance and reject overpayment.
        - FR-049: Mark the invoice as paid when the remaining balance reaches zero.

        Business rules:
        - The invoice must exist and belong to the authenticated business.
        - Payment amount must be greater than zero.
        - Payment amount cannot exceed the invoice''s current remaining balance.
        - Partial payments are allowed.
        - Payments cannot be recorded against draft, cancelled, void, or fully paid invoices.
        - After recording a payment, paid amount and remaining balance are recalculated.
        - If remaining balance is greater than zero, the invoice becomes partially_paid.
        - If remaining balance becomes zero, the invoice becomes paid.
        - A successful payment may trigger the configured payment_received administrator notification.
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice receiving the payment.
        schema:
          type: string
          format: uuid
        examples:
          invoice:
            value: 93483cf8-cad4-48a9-870d-2d6e5b986b23
      requestBody:
        required: true
        description: Payment information to record.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - amount
              - paymentDate
              - method
              properties:
                amount:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                  description: Amount received; cannot exceed current remaining balance.
                  examples:
                  - 500
                paymentDate:
                  type: string
                  format: date
                  examples:
                  - 2026-09-02
                method:
                  type: string
                  description: "Supported V1 payment method, based on FR-046."
                  enum:
                  - cash
                  - bank_transfer
                  - cheque
                  - card
                  examples:
                  - bank_transfer
            examples:
              bankTransfer:
                summary: Partial payment by bank transfer
                value:
                  amount: 500
                  paymentDate: 2026-09-02
                  method: bank_transfer
              fullPayment:
                summary: Payment covering the complete remaining balance
                value:
                  amount: 1498.5
                  paymentDate: 2026-09-02
                  method: card
      responses:
        "201":
          description: Payment recorded successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - invoice
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - invoiceId
                    - amount
                    - paymentDate
                    - method
                    - createdAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                      invoiceId:
                        type: string
                        format: uuid
                        readOnly: true
                      amount:
                        type: number
                        format: double
                        exclusiveMinimum: 0
                        readOnly: true
                      paymentDate:
                        type: string
                        format: date
                        readOnly: true
                      method:
                        type: string
                        description: "Supported V1 payment method, based on FR-046."
                        enum:
                        - cash
                        - bank_transfer
                        - cheque
                        - card
                        examples:
                        - bank_transfer
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                  invoice:
                    type: object
                    additionalProperties: false
                    required:
                    - total
                    - paidAmount
                    - remainingBalance
                    - status
                    properties:
                      total:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      paidAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      remainingBalance:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                      status:
                        type: string
                        description: |
                          Current invoice lifecycle/payment status.

                          - `draft`: Invoice is being prepared.
                          - `issued`: Invoice has been finalized and issued.
                          - `partially_paid`: At least one payment has been recorded, but a balance remains.
                          - `overdue`: Invoice is past its due date and still has an outstanding balance.
                          - `paid`: Remaining balance is zero.
                          - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
                          - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
                        enum:
                        - draft
                        - issued
                        - partially_paid
                        - overdue
                        - paid
                        - cancelled
                        - void
                        examples:
                        - issued
              examples:
                partialPaymentRecorded:
                  value:
                    data:
                      id: b128e278-67f8-44e1-89ea-c77419322ab3
                      invoiceId: 93483cf8-cad4-48a9-870d-2d6e5b986b23
                      amount: 500
                      paymentDate: 2026-09-02
                      method: bank_transfer
                      createdAt: 2026-09-02T08:30:00Z
                    invoice:
                      total: 1498.5
                      paidAmount: 500
                      remainingBalance: 998.5
                      status: partially_paid
        "400":
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - status
                - code
                - message
                - errors
                properties:
                  status:
                    type: integer
                    const: 400
                    examples:
                    - 400
                  code:
                    type: string
                    const: VALIDATION_ERROR
                    examples:
                    - VALIDATION_ERROR
                  message:
                    type: string
                    minLength: 1
                    examples:
                    - The request contains invalid data.
                  errors:
                    type: array
