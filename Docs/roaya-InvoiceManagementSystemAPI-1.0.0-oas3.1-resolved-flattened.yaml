      summary: List payments
      operationId: listPayments
      description: |
        Returns payments belonging to the authenticated business.
        Related Functional Requirement: FR-059.
        Supports payment-date filtering and pagination.
      security:
      - bearerAuth: []
      parameters:
      - name: dateFrom
        in: query
        required: false
        description: |
          Return payments recorded on or after this date.
          Can be used together with dateTo to filter payments
          within a specific period.
        schema:
          type: string
          format: date
        examples:
          startDate:
            value: 2026-09-01
      - name: dateTo
        in: query
        required: false
        description: |
          Return payments recorded on or before this date.
          Can be used together with dateFrom to filter payments
          within a specific period.
        schema:
          type: string
          format: date
        examples:
          endDate:
            value: 2026-09-30
      - name: customerId
        in: query
        required: false
        description: |
          Filter payments by customer.

          Because a payment belongs to an invoice and an invoice
          belongs to a customer, the system filters payments through
          the related invoice's customer.
