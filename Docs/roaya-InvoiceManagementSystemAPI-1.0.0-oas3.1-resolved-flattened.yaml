    patch:
      tags:
      - Invoices
      summary: Update draft invoice
      operationId: updateInvoice
      description: |
        Updates an existing draft invoice.

        Related Functional Requirements:
        - FR-028: Edit draft invoice due date, line items, discount, and tax.
        - FR-031: Recalculate totals.
        - FR-032: Apply tax after discount.
        - FR-033: Apply percentage or fixed discount before tax.

        Business rules:
        - Only invoices with `draft` status can be modified.
        - Issued invoice financial content is locked.
        - Invoice number cannot be changed.
        - Issue date cannot be changed.
        - Customer ownership cannot be changed through this endpoint.
        - At least one line item must remain on the invoice.
        - The server recalculates subtotal, discount, tax, and total after every modification.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Draft invoice fields to update.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              description: Editable fields of a draft invoice. Only draft invoices can be modified.
              properties:
                dueDate:
                  type: string
                  format: date
                  examples:
                  - 2026-10-15
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - description
                    - quantity
                    - unitPrice
                    properties:
                      description:
                        type: string
                        minLength: 1
                        maxLength: 500
                        description: Description of the invoiced product or service.
                        examples:
                        - Backend development
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        description: Quantity of the invoiced item.
                        examples:
                        - 10
                      unitPrice:
                        type: number
                        format: double
                        minimum: 0
                        description: Price per unit before discount and tax.
                        examples:
                        - 100
                discount:
                  oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        description: Type of discount applied before tax.
                        enum:
                        - percentage
                        - fixed
                        examples:
                        - percentage
                      value:
                        type: number
                        format: double
                        minimum: 0
                        description: Discount percentage or fixed monetary value depending on type.
                        examples:
                        - 10
                  - type: "null"
                taxRate:
                  type: number
                  format: double
                  minimum: 0
                  examples:
                  - 11
            examples:
              updateDueDate:
                value:
                  dueDate: 2026-10-15
              updateFinancialDetails:
                value:
                  items:
                  - description: Backend development
                    quantity: 12
                    unitPrice: 100
                  - description: Deployment
                    quantity: 1
                    unitPrice: 500
                  discount:
                    type: fixed
                    value: 100
                  taxRate: 11
