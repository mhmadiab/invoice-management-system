        contractId:
          value: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
    get:
      tags:
      - Contracts
      summary: Get contract details
      operationId: getContractById
      description: |
        Returns the details of a specific contract belonging to
        the authenticated business.

        Archived contracts remain retrievable so historical
        information is preserved.
      security:
      - bearerAuth: []
      responses:
