  /invoices/{invoiceId}/issue:
    post:
      tags:
      - Invoices
      summary: Issue draft invoice
      operationId: issueInvoice
      description: |
        Issues an existing draft invoice.

        Related Functional Requirement:
        - FR-027: Assign the next invoice sequence number and issue date and lock the invoice number and line items.

        Business rules:
        - Only a draft invoice can be issued.
        - The invoice must contain at least one valid line item.
        - The next invoice number is assigned atomically using the configured invoice prefix and sequence.
        - An invoice number must never be reused.
        - Issue date is assigned by the server.
        - Financial values are finalized when the invoice is issued.
        - Invoice number and financial content become immutable.
        - Tax rate and calculated tax amount are preserved at issuance.
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the draft invoice.
        schema:
          type: string
          format: uuid
        examples:
          invoice:
            value: 93483cf8-cad4-48a9-870d-2d6e5b986b23
      responses:
        "200":
          description: Invoice issued successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - customerId
                    - dueDate
                    - status
                    - items
                    - subtotal
                    - discountAmount
                    - taxAmount
                    - total
                    - paidAmount
                    - remainingBalance
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
