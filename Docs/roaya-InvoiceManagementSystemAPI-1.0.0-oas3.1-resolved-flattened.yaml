  /customers/{customerId}/invoices:
    get:
      tags:
      - Customers
      summary: Get customer invoices
      operationId: getCustomerInvoices
      description: |
        Returns invoices associated with a specific customer.

        Related Functional Requirement:
        - FR-018: Display all invoices associated with a customer.

        Historical invoices remain available even when the customer
        has been archived.
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer.
        schema:
          type: string
          format: uuid
        examples:
          customerId:
            value: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of invoices returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      responses:
        "200":
          description: Customer invoices retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: |
                        Summary representation of an invoice used when displaying
                        a customer''s invoice history.

                        The complete Invoice schema will be defined in the Invoice
                        Management API section.
                      required:
                      - id
                      - invoiceNumber
                      - issueDate
                      - dueDate
                      - status
                      - total
                      - remainingBalance
                      properties:
                        id:
                          type: string
                          format: uuid
                          examples:
                          - 93483cf8-cad4-48a9-870d-2d6e5b986b23
                        invoiceNumber:
                          type: string
                          minLength: 1
                          description: Assigned invoice number.
                          examples:
                          - INV-1001
                        issueDate:
                          type: string
                          format: date
