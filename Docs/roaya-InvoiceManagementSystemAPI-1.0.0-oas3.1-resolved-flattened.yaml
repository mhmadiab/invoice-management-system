            - invoiceId
            - amount
            - paymentDate
            - method
            - createdAt
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
              invoiceId:
                type: string
                format: uuid
                readOnly: true
              amount:
                type: number
                format: double
                exclusiveMinimum: 0
                readOnly: true
              paymentDate:
                type: string
                format: date
                readOnly: true
              method:
                type: string
                description: "Supported V1 payment method, based on FR-046."
                enum:
                - cash
                - bank_transfer
                - cheque
                - card
                examples:
                - bank_transfer
              createdAt:
                type: string
                format: date-time
                readOnly: true
        invoice:
          type: object
          additionalProperties: false
          required:
          - total
          - paidAmount
          - remainingBalance
          - status
          properties:
            total:
              type: number
              format: double
              minimum: 0
              readOnly: true
            paidAmount:
              type: number
              format: double
              minimum: 0
              readOnly: true
            remainingBalance:
              type: number
              format: double
              minimum: 0
              readOnly: true
            status:
              type: string
              description: |
                Current invoice lifecycle/payment status.

                - `draft`: Invoice is being prepared.
                - `issued`: Invoice has been finalized and issued.
                - `partially_paid`: At least one payment has been recorded, but a balance remains.
                - `overdue`: Invoice is past its due date and still has an outstanding balance.
                - `paid`: Remaining balance is zero.
                - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
                - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
              enum:
              - draft
              - issued
              - partially_paid
              - overdue
              - paid
              - cancelled
              - void
              examples:
              - issued
