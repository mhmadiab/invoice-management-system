  responses:
    BadRequest:
      description: Request body or parameters failed validation.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            - errors
            properties:
              status:
                type: integer
                const: 400
                examples:
                - 400
              code:
                type: string
                const: VALIDATION_ERROR
                examples:
                - VALIDATION_ERROR
              message:
                type: string
                minLength: 1
                examples:
                - The request contains invalid data.
              errors:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - field
                  - message
                  properties:
                    field:
                      type: string
                      minLength: 1
                      description: Request field that failed validation.
                      examples:
                      - email
                    message:
                      type: string
                      minLength: 1
                      description: Explanation of the validation failure.
                      examples:
                      - A valid email address is required.
                  examples:
                  - field: email
                    message: A valid email address is required.
            examples:
            - status: 400
              code: VALIDATION_ERROR
              message: The request contains invalid data.
              errors:
              - field: email
                message: A valid email address is required.
          examples:
            invalidEmail:
              summary: Invalid email address
              value:
                status: 400
                code: VALIDATION_ERROR
                message: The request contains invalid data.
                errors:
                - field: email
                  message: A valid email address is required.
    Unauthorized:
      description: |
        Authentication is required or the supplied access token
        is missing, invalid, or expired.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            properties:
              status:
                type: integer
                minimum: 400
                maximum: 599
                description: HTTP error status code.
                examples:
                - 401
              code:
                type: string
                minLength: 1
                description: |
                  Stable machine-readable error code that can be used
                  by frontend application logic.
                examples:
                - INVALID_CREDENTIALS
              message:
                type: string
                minLength: 1
                description: Human-readable error description.
                examples:
                - Invalid email or password.
            examples:
            - status: 401
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
          examples:
            missingAuthentication:
              summary: Authentication required
              value:
                status: 401
                code: UNAUTHORIZED
                message: Authentication required.
            expiredAccessToken:
              summary: Access token expired
              value:
                status: 401
                code: ACCESS_TOKEN_EXPIRED
                message: Access token has expired.
    Forbidden:
      description: |
        The authenticated administrator does not have permission
        to perform the requested operation.

        The API remains RBAC-ready even though V1 currently uses
        a single Administrator role.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            properties:
              status:
                type: integer
                minimum: 400
                maximum: 599
                description: HTTP error status code.
                examples:
                - 401
              code:
                type: string
                minLength: 1
                description: |
                  Stable machine-readable error code that can be used
                  by frontend application logic.
                examples:
                - INVALID_CREDENTIALS
              message:
                type: string
                minLength: 1
                description: Human-readable error description.
                examples:
                - Invalid email or password.
            examples:
            - status: 401
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
          examples:
            insufficientPermission:
              summary: Permission denied
              value:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this operation.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            properties:
              status:
                type: integer
                minimum: 400
                maximum: 599
                description: HTTP error status code.
                examples:
                - 401
              code:
                type: string
                minLength: 1
                description: |
                  Stable machine-readable error code that can be used
                  by frontend application logic.
                examples:
                - INVALID_CREDENTIALS
              message:
                type: string
                minLength: 1
                description: Human-readable error description.
                examples:
                - Invalid email or password.
            examples:
            - status: 401
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
          examples:
            resourceNotFound:
              summary: Resource not found
              value:
                status: 404
                code: RESOURCE_NOT_FOUND
                message: The requested resource was not found.
    Conflict:
      description: |
        The request cannot be completed because it conflicts with
        the current state of the resource.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            properties:
              status:
                type: integer
                minimum: 400
                maximum: 599
                description: HTTP error status code.
                examples:
                - 401
              code:
                type: string
                minLength: 1
                description: |
                  Stable machine-readable error code that can be used
                  by frontend application logic.
                examples:
                - INVALID_CREDENTIALS
              message:
                type: string
                minLength: 1
                description: Human-readable error description.
                examples:
                - Invalid email or password.
            examples:
            - status: 401
              code: INVALID_CREDENTIALS
              message: Invalid email or password.
          examples:
            resourceConflict:
              summary: Resource-state conflict
              value:
                status: 409
                code: RESOURCE_CONFLICT
                message: The operation conflicts with the current resource state.
    InternalServerError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - status
            - code
            - message
            properties:
              status:
                type: integer
