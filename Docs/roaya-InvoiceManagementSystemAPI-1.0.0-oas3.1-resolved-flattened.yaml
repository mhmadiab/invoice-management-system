    patch:
      tags:
      - Contracts
      summary: Update contract
      operationId: updateContract
      description: |
        Updates the editable fields of an existing contract.

        Related Functional Requirement:
        - FR-020: Edit contract title, expiration date, and
        contract value when the contract has a future expiration date.

        Business rules:
        - Only supplied fields are modified.
        - The contract must belong to the authenticated business.
        - An expired contract cannot be modified.
        - The title cannot be empty when supplied.
        - The expiration date must remain after the start date.
        - Contract value must not be negative.
        - Customer ownership cannot be changed through this endpoint.
        - Contract number cannot be modified.
        - Contract status cannot be modified through this endpoint.
        - Archiving is handled through the dedicated archive operation.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Contract fields that should be updated.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              description: |
                Editable contract fields.

                Related to FR-020.

                Only the title, expiration date, and contract value can
                be modified through this endpoint.

                The contract cannot be modified if it has already expired.
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Updated contract title.
                  examples:
                  - Banking Integration and Support Project
                expirationDate:
                  type: string
                  format: date
                  description: |
                    Updated expiration date.

                    It must remain later than the contract start date.
                  examples:
                  - 2027-06-01
                contractValue:
                  type: number
                  format: double
                  minimum: 0
                  description: Updated monetary value of the contract.
                  examples:
                  - 30000
              examples:
              - title: Banking Integration and Support Project
                expirationDate: 2027-06-01
                contractValue: 30000
            examples:
              updateContractValue:
                summary: Update contract value
                value:
                  contractValue: 30000
              extendContract:
                summary: Extend contract expiration
                value:
                  expirationDate: 2027-06-01
              updateTitleAndValue:
                summary: Update title and contract value
                value:
                  title: Banking Integration and Support Project
