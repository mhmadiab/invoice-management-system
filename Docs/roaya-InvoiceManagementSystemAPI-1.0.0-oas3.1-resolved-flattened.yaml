  /invoices:
    post:
      tags:
      - Invoices
      summary: Create draft invoice
      operationId: createInvoice
      description: |
        Creates a new draft invoice for a selected customer.

        Related Functional Requirements:
        - FR-026: Create a draft invoice for a selected customer with
        a due date and at least one line item containing description,
        quantity, and unit price.
        - FR-031: Calculate invoice total from line items, discount, and tax.
        - FR-032: Apply tax after discount and preserve tax information.
        - FR-033: Support percentage or fixed discounts before tax.
        - FR-034: Each invoice belongs to exactly one customer.

        Business rules:
        - The customer must exist and belong to the authenticated business.
        - At least one line item is required.
        - Every line item requires a description, quantity, and unit price.
        - Quantity must be greater than zero.
        - Unit price cannot be negative.
        - The server calculates line totals and invoice totals.
        - The client must not supply calculated subtotal or total values.
        - Discount is applied before tax.
        - Tax is calculated after discount.
        - A contract association is optional.
        - If contractId is supplied, the contract must belong to the same customer as the invoice.
        - Newly created invoices have `draft` status.
        - Invoice number and issue date are assigned when the invoice is issued.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Draft invoice information.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - customerId
              - dueDate
              - items
              properties:
                customerId:
                  type: string
                  format: uuid
                  description: Customer that owns the invoice.
                  examples:
                  - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                contractId:
                  type:
                  - string
                  - "null"
                  format: uuid
                  description: Optional contract associated with the invoice; it must belong to the same customer.
                  examples:
                  - 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                dueDate:
                  type: string
                  format: date
                  description: Invoice payment due date.
                  examples:
                  - 2026-10-01
                items:
                  type: array
                  minItems: 1
                  description: Invoice line items.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - description
                    - quantity
                    - unitPrice
                    properties:
                      description:
                        type: string
                        minLength: 1
                        maxLength: 500
                        description: Description of the invoiced product or service.
                        examples:
                        - Backend development
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        description: Quantity of the invoiced item.
                        examples:
                        - 10
                      unitPrice:
                        type: number
                        format: double
                        minimum: 0
                        description: Price per unit before discount and tax.
                        examples:
                        - 100
                discount:
                  oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        description: Type of discount applied before tax.
                        enum:
                        - percentage
                        - fixed
                        examples:
                        - percentage
                      value:
                        type: number
                        format: double
                        minimum: 0
                        description: Discount percentage or fixed monetary value depending on type.
                        examples:
                        - 10
                  - type: "null"
                  description: Optional discount applied before tax.
                taxRate:
                  type: number
                  format: double
                  minimum: 0
                  description: "Tax percentage applied after discount. If omitted, the configured default tax may be used."
                  examples:
                  - 11
            examples:
              standardInvoice:
                summary: Draft invoice with tax and percentage discount
                value:
                  customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                  contractId: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                  dueDate: 2026-10-01
                  items:
                  - description: Backend development
                    quantity: 10
                    unitPrice: 100
                  - description: Deployment and configuration
                    quantity: 1
                    unitPrice: 500
                  discount:
                    type: percentage
                    value: 10
                  taxRate: 11
              simpleInvoice:
                summary: Draft invoice without contract or discount
                value:
                  customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                  dueDate: 2026-10-01
                  items:
                  - description: Software development services
                    quantity: 1
                    unitPrice: 1500
                  taxRate: 11
      responses:
        "201":
          description: Draft invoice created successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - customerId
                    - dueDate
                    - status
                    - items
                    - subtotal
                    - discountAmount
                    - taxAmount
                    - total
                    - paidAmount
                    - remainingBalance
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        examples:
                        - 93483cf8-cad4-48a9-870d-2d6e5b986b23
                      customerId:
                        type: string
                        format: uuid
                        examples:
                        - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      contractId:
                        type:
                        - string
                        - "null"
                        format: uuid
                        examples:
                        - 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                      invoiceNumber:
                        type:
                        - string
                        - "null"
                        readOnly: true
                        description: Server-assigned invoice number; null while draft.
                        examples:
                        - INV-1001
                      issueDate:
                        type:
                        - string
                        - "null"
                        format: date
                        readOnly: true
                        description: Server-assigned issue date; null while draft.
                        examples:
                        - 2026-09-01
                      dueDate:
                        type: string
                        format: date
                        examples:
                        - 2026-10-01
                      status:
                        type: string
                        description: |
                          Current invoice lifecycle/payment status.

                          - `draft`: Invoice is being prepared.
                          - `issued`: Invoice has been finalized and issued.
                          - `partially_paid`: At least one payment has been recorded, but a balance remains.
                          - `overdue`: Invoice is past its due date and still has an outstanding balance.
                          - `paid`: Remaining balance is zero.
                          - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.
                          - `void`: Recognized status for filtering and history; V1 does not define a public transition operation.
                        enum:
                        - draft
                        - issued
                        - partially_paid
                        - overdue
                        - paid
                        - cancelled
                        - void
                        examples:
                        - issued
                      items:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - id
                          - description
                          - quantity
                          - unitPrice
                          - lineTotal
                          properties:
                            id:
                              type: string
                              format: uuid
                              readOnly: true
                              examples:
                              - 7d843ebc-2d87-4664-9845-a38c89cb3d73
                            description:
                              type: string
                              examples:
                              - Backend development
                            quantity:
                              type: number
                              exclusiveMinimum: 0
                              examples:
                              - 10
                            unitPrice:
                              type: number
                              format: double
                              minimum: 0
                              examples:
                              - 100
                            lineTotal:
                              type: number
                              format: double
                              minimum: 0
                              readOnly: true
                              description: Server-calculated quantity multiplied by unit price.
                              examples:
                              - 1000
                      subtotal:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Sum of line totals before discount and tax.
                        examples:
                        - 1500
                      discountType:
                        oneOf:
                        - type: string
                          description: Type of discount applied before tax.
                          enum:
                          - percentage
                          - fixed
                          examples:
                          - percentage
                        - type: "null"
                        readOnly: true
                      discountValue:
                        type:
                        - number
                        - "null"
                        format: double
                        minimum: 0
                        readOnly: true
                        examples:
                        - 10
                      discountAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Server-calculated monetary discount amount.
                        examples:
                        - 150
                      taxRate:
                        type: number
                        format: double
                        minimum: 0
                        description: Tax percentage applicable to the invoice.
                        examples:
                        - 11
                      taxAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Server-calculated tax amount after discount.
                        examples:
                        - 148.5
                      total:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Final invoice total after discount and tax.
                        examples:
                        - 1498.5
                      paidAmount:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Sum of payments recorded against the invoice.
                        examples:
                        - 0
                      remainingBalance:
                        type: number
                        format: double
                        minimum: 0
                        readOnly: true
                        description: Invoice total minus recorded payments.
                        examples:
                        - 1498.5
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        examples:
                        - 2026-09-01T18:30:00Z
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        examples:
                        - 2026-09-01T18:45:00Z
              examples:
                invoiceCreated:
                  value:
                    data:
                      id: 93483cf8-cad4-48a9-870d-2d6e5b986b23
                      customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      contractId: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                      invoiceNumber: null
                      issueDate: null
                      dueDate: 2026-10-01
                      status: draft
                      items:
                      - id: 7d843ebc-2d87-4664-9845-a38c89cb3d73
