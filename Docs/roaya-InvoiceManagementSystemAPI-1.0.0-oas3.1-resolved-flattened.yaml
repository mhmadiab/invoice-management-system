          description: Customer contracts retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    description: Contracts matching the supplied filters.
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - id
                      - customerId
                      - contractNumber
                      - title
                      - startDate
                      - expirationDate
                      - contractValue
                      - billingFrequency
                      - status
                      - archived
                      - createdAt
                      - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          readOnly: true
                          description: Unique contract identifier.
                          examples:
                          - 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                        customerId:
                          type: string
                          format: uuid
                          description: |
                            Identifier of the customer that owns the contract.

                            A contract belongs to exactly one customer.
                          examples:
                          - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                        contractNumber:
