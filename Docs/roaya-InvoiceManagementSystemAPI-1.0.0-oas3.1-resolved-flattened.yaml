  /contracts/{contractId}/archive:
    post:
      tags:
      - Contracts
      summary: Archive contract
      operationId: archiveContract
      description: |
        Archives an existing contract.

        Business rules:
        - Archiving sets the contract `archived` property to `true`.
        - Archiving does not change the contract lifecycle `status`.
        - Archived contracts remain available for historical reference.
        - Archived contracts are excluded from active contract lists and
        contract expiry notifications.
        - Archiving does not delete the contract or its related historical data.

        Related Functional Requirement:
        - FR-021: Archived contracts are excluded from active lists and
        expiry notifications while remaining viewable.
