  /contracts:
    post:
      tags:
      - Contracts
      summary: Create contract
      operationId: createContract
      description: |
        Creates a contract for a selected customer.

        Related Functional Requirements:
        - FR-019: Create a contract with title, start date,
        expiration date, contract value, and billing frequency.
        - FR-022: Every contract belongs to exactly one customer.

        Business rules:
        - The customer must belong to the authenticated business.
        - Each contract is associated with exactly one customer.
        - The contract title is required.
        - Start date and expiration date are required.
        - Expiration date must be after the start date.
        - Contract value must not be negative.
        - Billing frequency is required.
        - A newly created contract starts with `draft` status.
        - Contract number is generated by the server.
        - The contract is automatically associated with the
        authenticated administrator's business.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Contract information.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - customerId
              - title
              - startDate
              - expirationDate
              - contractValue
              - billingFrequency
              properties:
                customerId:
                  type: string
                  format: uuid
                  description: |
                    Customer that owns the contract.

                    The selected customer must exist and belong to the
                    authenticated business.
                  examples:
                  - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Contract title.
                  examples:
                  - Banking Integration Project
                description:
                  type:
                  - string
                  - "null"
                  maxLength: 2000
                  description: Optional description of the contract.
                  examples:
                  - Development and integration of a banking payment solution.
                startDate:
                  type: string
                  format: date
                  description: Contract start date.
                  examples:
                  - 2026-09-01
                expirationDate:
                  type: string
                  format: date
                  description: |
                    Contract expiration date.

                    Must be later than the contract start date.
                  examples:
                  - 2027-03-01
                contractValue:
                  type: number
                  format: double
                  minimum: 0
                  description: Monetary value of the contract.
                  examples:
                  - 25000
                billingFrequency:
                  type: string
                  description: |
                    Billing frequency associated with the contract.

                    This value describes the contractual billing schedule.
                  enum:
                  - one_time
                  - weekly
                  - monthly
                  - quarterly
                  - semi_annually
                  - annually
                  examples:
                  - monthly
              examples:
              - customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                title: Banking Integration Project
                description: Development and integration of a banking payment solution.
                startDate: 2026-09-01
                expirationDate: 2027-03-01
                contractValue: 25000
                billingFrequency: monthly
            examples:
              softwareDevelopmentContract:
                summary: Software development contract
                value:
                  customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                  title: Banking Integration Project
                  description: Development and integration of a banking payment solution.
                  startDate: 2026-09-01
                  expirationDate: 2027-03-01
                  contractValue: 25000
                  billingFrequency: monthly
      responses:
        "201":
          description: Contract created successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - customerId
                    - contractNumber
                    - title
                    - startDate
                    - expirationDate
                    - contractValue
                    - billingFrequency
                    - status
                    - archived
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                        format: uuid
                        readOnly: true
                        description: Unique contract identifier.
                        examples:
                        - 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                      customerId:
                        type: string
                        format: uuid
                        description: |
                          Identifier of the customer that owns the contract.

                          A contract belongs to exactly one customer.
                        examples:
                        - eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      contractNumber:
                        type: string
                        minLength: 1
                        readOnly: true
                        description: |
                          Server-generated contract reference number.
                        examples:
                        - CTR-1001
                      title:
                        type: string
                        minLength: 1
                        maxLength: 200
                        description: Contract title.
                        examples:
                        - Banking Integration Project
                      description:
                        type:
                        - string
                        - "null"
                        maxLength: 2000
                        description: Optional description of the contract.
                        examples:
                        - Development and integration of a banking payment solution.
                      startDate:
                        type: string
                        format: date
                        description: Contract start date.
                        examples:
                        - 2026-09-01
                      expirationDate:
                        type: string
                        format: date
                        description: Contract expiration date.
                        examples:
                        - 2027-03-01
                      archived:
                        type: boolean
                        readOnly: true
                        description: |
                          Indicates whether the contract is archived.
                          Archiving a contract does not change its lifecycle status.
                        examples:
                        - false
                      contractValue:
                        type: number
                        format: double
                        minimum: 0
                        description: |
                          Monetary value of the contract.

                          Currency is determined by the business/system currency settings.
                        examples:
                        - 25000
                      billingFrequency:
                        type: string
                        description: |
                          Billing frequency associated with the contract.

                          This value describes the contractual billing schedule.
                        enum:
                        - one_time
                        - weekly
                        - monthly
                        - quarterly
                        - semi_annually
                        - annually
                        examples:
                        - monthly
                      status:
                        enum:
                        - draft
                        - pending_approval
                        - active
                        - completed
                        - cancelled
                        archived: ""
                        type: boolean
                        readOnly: true
                        description: |
                          Indicates whether the contract is archived.
                          Archiving a contract does not change its lifecycle status.
                        examples:
                        - false
                      createdAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date and time when the contract was created.
                        examples:
                        - 2026-09-01T13:30:00Z
                      updatedAt:
                        type: string
                        format: date-time
                        readOnly: true
                        description: Date and time when the contract was last modified.
                        examples:
                        - 2026-09-01T14:45:00Z
                    examples:
                    - id: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                      customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      contractNumber: CTR-1001
                      title: Banking Integration Project
                      description: Development and integration of a banking payment solution.
                      startDate: 2026-09-01
                      expirationDate: 2027-03-01
                      contractValue: 25000
                      billingFrequency: monthly
                      status: active
                      createdAt: 2026-09-01T13:30:00Z
                      updatedAt: 2026-09-01T14:45:00Z
                examples:
                - data:
                    id: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                    customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                    contractNumber: CTR-1001
                    title: Banking Integration Project
                    description: Development and integration of a banking payment solution.
                    startDate: 2026-09-01
                    expirationDate: 2027-03-01
                    contractValue: 25000
                    billingFrequency: monthly
                    status: active
                    createdAt: 2026-09-01T13:30:00Z
                    updatedAt: 2026-09-01T13:30:00Z
              examples:
                contractCreated:
                  summary: Successfully created contract
                  value:
                    data:
                      id: 4c50f3ef-f7cb-4d08-b752-b134ce192e74
                      customerId: eaed7a0d-67a4-4d69-bc70-a9ea6a245711
                      contractNumber: CTR-1001
