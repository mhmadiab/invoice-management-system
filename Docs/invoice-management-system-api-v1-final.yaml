      description: 'Summary representation of an invoice used when displaying

        a customer''s invoice history.


        The complete Invoice schema will be defined in the Invoice

        Management API section.

        '
      required:
      - id
      - invoiceNumber
      - issueDate
      - dueDate
      - status
      - total
      - remainingBalance
      - isOverdue
      - daysOverdue
      properties:
