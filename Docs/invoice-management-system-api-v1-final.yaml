                  value:
                    data:
                      id: 601
                      invoiceId: 301
                      recipientEmail: john.smith@example.com
                      status: sent
                      sentAt: '2026-09-01T19:00:00Z'
                      failureReason: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
