                      dueDate: '2026-10-01'
                      status: issued
                      total: 1498.5
                      paidAmount: 0.0
                      remainingBalance: 1498.5
                      isOverdue: false
                      daysOverdue: 0
                    pagination:
                      page: 1
                      pageSize: 20
                      totalItems: 1
                      totalPages: 1
        '400':
