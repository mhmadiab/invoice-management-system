    patch:
      tags:
      - Invoices
      summary: Update draft invoice
      operationId: updateInvoice
      description: 'Updates an existing draft invoice.


        Related Functional Requirements:

        - FR-028: Edit draft invoice due date, line items, discount, and tax.

        - FR-031: Recalculate totals.

        - FR-032: Apply tax after discount.

        - FR-033: Apply percentage or fixed discount before tax.


        Business rules:

        - Only invoices with `draft` status can be modified.

        - Issued invoice financial content is locked.

        - Invoice number cannot be changed.

        - Issue date cannot be changed.

        - Customer ownership cannot be changed through this endpoint.

        - At least one line item must remain on the invoice.

        - The server recalculates subtotal, discount, tax, and total after every modification.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Draft invoice fields to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
            examples:
              updateDueDate:
                value:
                  dueDate: '2026-10-15'
              updateFinancialDetails:
                value:
                  items:
                  - description: Backend development
                    quantity: 12
                    unitPrice: 100.0
                  - description: Deployment
                    quantity: 1
                    unitPrice: 500.0
                  discount:
                    type: fixed
                    value: 100.0
                  taxRate: 11
      responses:
        '200':
          description: Draft invoice updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceNotFound:
                  value:
                    status: 404
                    code: INVOICE_NOT_FOUND
                    message: Invoice was not found.
        '409':
          description: Invoice cannot be modified in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceNotDraft:
                  value:
                    status: 409
                    code: INVOICE_NOT_EDITABLE
                    message: Only draft invoices can be modified.
        '422':
          description: 'The request is valid, but the invoice cannot be modified

            because it is no longer in draft status.


            Only draft invoices can be modified. Once an invoice has

            been issued, its financial content is locked.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceNotDraft:
                  summary: Attempt to modify a non-draft invoice
                  value:
                    status: 422
                    code: INVOICE_NOT_EDITABLE
                    message: Only draft invoices can be modified.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invoices/{invoiceId}/issue:
    post:
      tags:
      - Invoices
      summary: Issue draft invoice
      operationId: issueInvoice
      description: 'Issues an existing draft invoice.


        Related Functional Requirement:

        - FR-027: Assign the next invoice sequence number and issue date and lock the invoice number and line items.


        Business rules:

        - Only a draft invoice can be issued.

        - The invoice must contain at least one valid line item.

        - The next invoice number is assigned atomically using the configured invoice prefix and sequence.

        - An invoice number must never be reused.

        - Issue date is assigned by the server.

        - Financial values are finalized when the invoice is issued.

        - Invoice number and financial content become immutable.

        - Tax rate and calculated tax amount are preserved at issuance.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the draft invoice.
        schema:
          type: integer
          format: int64
        examples:
          invoice:
            value: 301
      responses:
        '200':
          description: Invoice issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice cannot be issued in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceAlreadyIssued:
                  value:
                    status: 409
                    code: INVOICE_NOT_DRAFT
                    message: Only draft invoices can be issued.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invoices/{invoiceId}/cancel:
    post:
      tags:
      - Invoices
      summary: Cancel issued invoice
      operationId: cancelInvoice
      description: 'Cancels an issued invoice that has not been fully paid.


        Related Functional Requirement:

        - FR-030: Cancel an issued invoice that is not fully paid, preserve its payment history, and exclude it from outstanding
        balances and reminders.


        Business rules:

        - Draft invoices are not cancelled through this operation.

        - Fully paid invoices cannot be cancelled.

        - Existing payments are preserved.

        - No refund is created.

        - Cancelled invoices are excluded from outstanding balances.

        - Future reminders for the invoice are stopped.

        - Cancellation does not delete the invoice.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice to cancel.
        schema:
          type: integer
          format: int64
        examples:
          invoice:
            value: 301
      responses:
        '200':
          description: Invoice cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                fullyPaid:
                  value:
                    status: 409
                    code: PAID_INVOICE_CANNOT_BE_CANCELLED
                    message: A fully paid invoice cannot be cancelled.
                alreadyCancelled:
                  value:
                    status: 409
                    code: INVOICE_ALREADY_CANCELLED
                    message: Invoice is already cancelled.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invoices/{invoiceId}/pdf:
