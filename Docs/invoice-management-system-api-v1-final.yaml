  /invoices:
    post:
      tags:
      - Invoices
      summary: Create draft invoice
      operationId: createInvoice
      description: "Creates a new draft invoice for a selected customer.\n\nRelated Functional Requirements:\n- FR-026: Create\
        \ a draft invoice for a selected customer with\n  a due date and at least one line item containing description,\n\
        \  quantity, and unit price.\n- FR-031: Calculate invoice total from line items, discount, and tax.\n- FR-032: Apply\
        \ tax after discount and preserve tax information.\n- FR-033: Support percentage or fixed discounts before tax.\n\
        - FR-034: Each invoice belongs to exactly one customer.\n\nBusiness rules:\n- The customer must exist and belong to\
        \ the authenticated business.\n- At least one line item is required.\n- Every line item requires a description, quantity,\
        \ and unit price.\n- Quantity must be greater than zero.\n- Unit price cannot be negative.\n- The server calculates\
        \ line totals and invoice totals.\n- The client must not supply calculated subtotal or total values.\n- Discount is\
        \ applied before tax.\n- Tax is calculated after discount.\n- A contract association is optional.\n- If contractId\
        \ is supplied, the contract must belong to the same customer as the invoice.\n- Newly created invoices have `draft`\
        \ status.\n- Invoice number and issue date are assigned when the invoice is issued.\n"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Draft invoice information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            examples:
              standardInvoice:
                summary: Draft invoice with tax and percentage discount
                value:
                  customerId: 101
                  contractId: 201
                  dueDate: '2026-10-01'
                  items:
                  - description: Backend development
                    quantity: 10
                    unitPrice: 100.0
                  - description: Deployment and configuration
                    quantity: 1
                    unitPrice: 500.0
                  discount:
                    type: percentage
                    value: 10
                  taxRate: 11
              simpleInvoice:
                summary: Draft invoice without contract or discount
                value:
                  customerId: 101
                  dueDate: '2026-10-01'
                  items:
                  - description: Software development services
                    quantity: 1
                    unitPrice: 1500.0
                  taxRate: 11
      responses:
        '201':
          description: Draft invoice created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
              examples:
                invoiceCreated:
                  value:
                    data:
                      id: 301
                      customerId: 101
                      contractId: 201
                      invoiceNumber: null
                      issueDate: null
                      dueDate: '2026-10-01'
                      status: draft
                      items:
                      - id: 401
                        description: Backend development
                        quantity: 10
                        unitPrice: 100.0
                        lineTotal: 1000.0
                      - id: 402
                        description: Deployment and configuration
                        quantity: 1
                        unitPrice: 500.0
                        lineTotal: 500.0
                      subtotal: 1500.0
                      discountType: percentage
                      discountValue: 10
                      discountAmount: 150.0
                      taxRate: 11
                      taxAmount: 148.5
                      total: 1498.5
                      paidAmount: 0.0
                      remainingBalance: 1498.5
                      createdAt: '2026-09-01T18:30:00Z'
                      updatedAt: '2026-09-01T18:30:00Z'
                      isOverdue: false
                      daysOverdue: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer or optional contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
