      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Administrator notifications retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorNotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /notifications/{notificationId}:
    get:
      tags:
      - Notifications
      summary: Get administrator notification
      operationId: getAdministratorNotification
      description: Returns details of a specific administrator notification. This endpoint does not resend or modify it.
      security:
      - bearerAuth: []
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Administrator notification retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contracts/{contractId}/unarchive:
    post:
      tags:
      - Contracts
      summary: Unarchive contract
      operationId: unarchiveContract
      description: 'Restores an archived contract to active contract lists without changing its lifecycle status.


        Business rules:

        - The contract must belong to the authenticated business.

        - Unarchiving sets `isArchived` to false.

        - The lifecycle `status` is preserved.

        - Historical records remain unchanged.

        - Contract-expiration processing may resume when the lifecycle status and dates otherwise make the contract eligible.'
      security:
      - bearerAuth: []
      parameters:
      - name: contractId
        in: path
        required: true
        description: Unique identifier of the contract to unarchive.
        schema:
          type: integer
          format: int64
        examples:
          contractId:
            value: 201
      responses:
        '200':
          description: Contract unarchived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
              examples:
                contractUnarchived:
                  value:
                    data:
                      id: 201
                      customerId: 101
                      contractNumber: CTR-1001
                      title: Banking Integration Project
                      description: Development and integration of a banking payment solution.
                      startDate: '2026-09-01'
                      expirationDate: '2027-03-01'
                      contractValue: 25000.0
                      billingFrequency: monthly
                      status: active
                      isArchived: false
                      createdAt: '2026-09-01T13:30:00Z'
                      updatedAt: '2026-09-01T15:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Contract does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Contract is not archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notArchived:
                  value:
                    status: 409
                    code: CONTRACT_NOT_ARCHIVED
                    message: Contract is not archived.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}/unarchive:
    post:
      tags:
      - Customers
      summary: Unarchive customer
      operationId: unarchiveCustomer
      description: 'Restores an archived customer without deleting or recreating historical data.


        Business rules:

        - The customer must belong to the authenticated business.

        - The customer status changes from `archived` to `active`.

        - Existing invoices, contracts, payments, and history remain unchanged.

        - The customer becomes available again for active customer selections.'
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer to unarchive.
        schema:
          type: integer
          format: int64
        examples:
          customerId:
            value: 101
      responses:
        '200':
          description: Customer unarchived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customerUnarchived:
                  value:
                    data:
                      id: 101
                      name: John Smith
                      email: john.smith@example.com
                      phone: '+96170123456'
                      billingAddress: Beirut, Lebanon
                      type: individual
                      status: active
                      createdAt: '2026-08-01T09:00:00Z'
                      updatedAt: '2026-09-01T13:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Customer is not archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notArchived:
                  value:
                    status: 409
                    code: CUSTOMER_NOT_ARCHIVED
                    message: Customer is not archived.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invoices/{invoiceId}/void:
    post:
      tags:
      - Invoices
      summary: Void invoice
      operationId: voidInvoice
      description: 'Voids an invoice that was created or issued in error.


        Business rules:

        - Only a draft or issued invoice with no recorded payments can be voided.

        - Partially paid and paid invoices cannot be voided.

        - Cancelled invoices cannot be converted to void.

        - Voiding preserves the invoice record for traceability.

        - A void invoice is excluded from outstanding balances and reminders.

        - Future reminders are stopped.

        - No refund is created.'
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice to void.
        schema:
          type: integer
          format: int64
        examples:
          invoiceId:
            value: 301
      responses:
        '200':
          description: Invoice voided successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invoice cannot be voided in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceHasPayments:
                  value:
                    status: 409
                    code: INVOICE_WITH_PAYMENTS_CANNOT_BE_VOIDED
                    message: An invoice with recorded payments cannot be voided.
                invoiceAlreadyVoid:
                  value:
                    status: 409
                    code: INVOICE_ALREADY_VOID
                    message: Invoice is already void.
                invoiceNotVoidable:
                  value:
                    status: 409
                    code: INVOICE_NOT_VOIDABLE
                    message: Invoice cannot be voided in its current state.
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token used to access protected endpoints.


        Include the token in the HTTP Authorization header:


        Authorization: Bearer <access-token>

        '
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Registered administrator email address.
          examples:
          - admin@example.com
        password:
          type: string
          format: password
          minLength: 1
          description: Administrator password.
          examples:
          - StrongPassword123!
      examples:
      - email: admin@example.com
        password: StrongPassword123!
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      - administrator
      properties:
        accessToken:
          type: string
          minLength: 1
          description: 'Short-lived JWT access token used to authorize protected

            API operations.

            '
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          const: Bearer
          description: Authentication scheme used with the access token.
          examples:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 'Number of seconds until the access token expires.

            '
          examples:
          - 900
        administrator:
          $ref: '#/components/schemas/AuthenticatedAdministrator'
      examples:
      - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType: Bearer
        expiresIn: 900
        administrator:
          id: 1
          email: admin@example.com
    AuthenticatedAdministrator:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      properties:
        id:
          type: integer
          format: int64
          description: Unique administrator identifier.
          examples:
          - 1
        email:
          type: string
          format: email
          description: Authenticated administrator email address.
          examples:
          - admin@example.com
      examples:
      - id: 1
        email: admin@example.com
    TokenRefreshResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Newly generated JWT access token.
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          const: Bearer
          examples:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Access-token lifetime in seconds.
          examples:
          - 900
      examples:
      - accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType: Bearer
        expiresIn: 900
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP error status code.
          examples:
          - 401
        code:
          type: string
          minLength: 1
          description: 'Stable machine-readable error code that can be used

            by frontend application logic.

            '
          examples:
          - INVALID_CREDENTIALS
        message:
          type: string
          minLength: 1
          description: Human-readable error description.
          examples:
          - Invalid email or password.
      examples:
      - status: 401
        code: INVALID_CREDENTIALS
        message: Invalid email or password.
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - code
      - message
      - errors
      properties:
        status:
          type: integer
          const: 400
          examples:
          - 400
        code:
          type: string
          const: VALIDATION_ERROR
          examples:
          - VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          examples:
          - The request contains invalid data.
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldValidationError'
      examples:
      - status: 400
        code: VALIDATION_ERROR
        message: The request contains invalid data.
        errors:
        - field: email
          message: A valid email address is required.
    FieldValidationError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          type: string
          minLength: 1
          description: Request field that failed validation.
          examples:
          - email
        message:
          type: string
          minLength: 1
          description: Explanation of the validation failure.
          examples:
          - A valid email address is required.
      examples:
      - field: email
        message: A valid email address is required.
    CustomerType:
      type: string
      description: 'Type of customer.


        - `individual`: An individual person.

        - `organization`: A company, corporate entity, or professional group.

        '
      enum:
      - individual
      - organization
      examples:
      - individual
    CustomerStatus:
      type: string
      description: "Current customer lifecycle status.\n\n- `active`: Customer is available for active business operations.\n\
        - `archived`: Customer is retained for historical purposes but\n  excluded from active selections.\n"
      enum:
      - active
      - archived
      examples:
      - active
    Customer:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - email
      - type
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique customer identifier.
          examples:
          - 101
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Customer's full name or organization name.
          examples:
          - John Smith
        email:
          type: string
          format: email
          maxLength: 254
          description: 'Customer email address used for communication,

            invoice delivery, and reminders.

            '
          examples:
          - john.smith@example.com
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Optional customer phone number.
          examples:
          - '+96170123456'
        billingAddress:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Optional customer billing address.
          examples:
          - Beirut, Lebanon
        type:
          $ref: '#/components/schemas/CustomerType'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the customer was created.
          examples:
          - '2026-09-01T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the customer was last modified.
          examples:
          - '2026-09-01T12:15:00Z'
      examples:
      - id: 101
        name: John Smith
        email: john.smith@example.com
        phone: '+96170123456'
        billingAddress: Beirut, Lebanon
        type: individual
        status: active
        createdAt: '2026-09-01T10:30:00Z'
        updatedAt: '2026-09-01T12:15:00Z'
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Customer's full name or organization name.
          examples:
          - John Smith
        email:
          type: string
          format: email
          maxLength: 254
          description: 'Customer email address.


            The email must be unique within the authenticated business.

            '
          examples:
          - john.smith@example.com
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Optional customer phone number.
          examples:
          - '+96170123456'
        billingAddress:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Optional customer billing address.
          examples:
          - Beirut, Lebanon
        type:
          $ref: '#/components/schemas/CustomerType'
      examples:
      - name: John Smith
        email: john.smith@example.com
        phone: '+96170123456'
        billingAddress: Beirut, Lebanon
        type: individual
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Customer fields to modify.


        Because this endpoint uses PATCH, only supplied fields are changed.

        Customer status cannot be modified directly through this request.

        Use the dedicated archive/unarchive endpoints to change the customer archive state.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Updated customer name.
          examples:
          - John Smith
        email:
          type: string
          format: email
          maxLength: 254
          description: 'Updated customer email address.


            It must not conflict with another customer''s email.

            '
          examples:
          - new.email@example.com
        phone:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Updated customer phone number.
          examples:
          - '+96170987654'
        billingAddress:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Updated customer billing address.
          examples:
          - Hamra, Beirut, Lebanon
        type:
          $ref: '#/components/schemas/CustomerType'
      examples:
      - phone: '+96170987654'
        billingAddress: Hamra, Beirut, Lebanon
    CustomerResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Customer'
      examples:
      - data:
          id: 101
          name: John Smith
          email: john.smith@example.com
          phone: '+96170123456'
          billingAddress: Beirut, Lebanon
          type: individual
          status: active
          createdAt: '2026-09-01T10:30:00Z'
          updatedAt: '2026-09-01T10:30:00Z'
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number.
          examples:
          - 1
        pageSize:
          type: integer
          minimum: 1
          description: Number of items requested per page.
          examples:
          - 20
        totalItems:
          type: integer
          minimum: 0
          description: Total number of matching records.
          examples:
          - 45
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages.
          examples:
          - 3
      examples:
      - page: 1
        pageSize: 20
        totalItems: 45
        totalPages: 3
    CustomerListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          description: Customers matching the supplied search and filters.
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      examples:
      - data:
        - id: 101
          name: John Smith
          email: john.smith@example.com
          phone: '+96170123456'
          billingAddress: Beirut, Lebanon
          type: individual
          status: active
          createdAt: '2026-09-01T10:30:00Z'
          updatedAt: '2026-09-01T10:30:00Z'
        pagination:
          page: 1
          pageSize: 20
          totalItems: 1
          totalPages: 1
    CustomerInvoiceSummary:
      type: object
