        description: Filter invoices by lifecycle/payment status.
        schema:
          $ref: '#/components/schemas/InvoiceStatus'
        examples:
          issued:
            value: issued
      - name: issueDateFrom
        in: query
        required: false
        description: Include invoices issued on or after this date.
        schema:
          type: string
          format: date
        examples:
          fromDate:
            value: '2026-09-01'
      - name: issueDateTo
        in: query
        required: false
        description: Include invoices issued on or before this date.
        schema:
          type: string
          format: date
        examples:
          toDate:
            value: '2026-09-30'
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of invoices returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      - name: overdue
        in: query
        required: false
        description: Filter by derived overdue condition. An invoice is overdue when its due date has passed, remaining balance
          is greater than zero, and lifecycle status is not cancelled or void. This filter can be combined with the lifecycle
          `status` filter.
        schema:
          type: boolean
        examples:
          overdueInvoices:
