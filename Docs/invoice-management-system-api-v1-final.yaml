          type: string
          format: date
        examples:
          startDate:
            value: '2026-09-01'
      - name: dateTo
        in: query
        required: false
        description: 'Return payments recorded on or before this date.

          Can be used together with dateFrom to filter payments

          within a specific period.

          '
        schema:
          type: string
          format: date
        examples:
          endDate:
            value: '2026-09-30'
      - name: customerId
        in: query
        required: false
        description: 'Filter payments by customer.


