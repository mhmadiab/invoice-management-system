          remainingBalance: 1500.0
          isOverdue: false
          daysOverdue: 0
        pagination:
          page: 1
          pageSize: 20
          totalItems: 1
          totalPages: 1
    ContractStatus:
      type: string
      description: 'Current contract lifecycle status.


        - `draft`: Contract is being prepared.

        - `pending_approval`: Contract is awaiting approval.

        - `active`: Contract is currently active.

        - `completed`: Contract has been completed.

        - `cancelled`: Contract has been cancelled.


        Archival is independent from lifecycle status and is represented by `isArchived`.'
      enum:
      - draft
      - pending_approval
      - active
      - completed
      - cancelled
      examples:
      - active
    BillingFrequency:
      type: string
      description: 'Billing frequency associated with the contract.


        This value describes the contractual billing schedule.

        '
      enum:
      - one_time
      - weekly
      - monthly
      - quarterly
      - semi_annually
      - annually
      examples:
      - monthly
    Contract:
      type: object
      additionalProperties: false
      required:
      - id
      - customerId
      - contractNumber
      - title
      - startDate
      - expirationDate
      - contractValue
      - billingFrequency
      - status
      - isArchived
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Unique contract identifier.
          examples:
          - 201
        customerId:
          type: integer
          format: int64
          description: 'Identifier of the customer that owns the contract.


            A contract belongs to exactly one customer.

            '
          examples:
          - 101
        contractNumber:
          type: string
          minLength: 1
          readOnly: true
          description: 'Server-generated contract reference number.

            '
          examples:
          - CTR-1001
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Contract title.
          examples:
          - Banking Integration Project
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Optional description of the contract.
          examples:
          - Development and integration of a banking payment solution.
        startDate:
          type: string
          format: date
          description: Contract start date.
          examples:
          - '2026-09-01'
        expirationDate:
          type: string
          format: date
          description: Contract expiration date.
          examples:
          - '2027-03-01'
        contractValue:
          type: number
          format: double
          minimum: 0
          description: 'Monetary value of the contract.


            Currency is determined by the business/system currency settings.

            '
          examples:
          - 25000.0
        billingFrequency:
          $ref: '#/components/schemas/BillingFrequency'
        status:
          $ref: '#/components/schemas/ContractStatus'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the contract was created.
          examples:
          - '2026-09-01T13:30:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the contract was last modified.
          examples:
          - '2026-09-01T14:45:00Z'
        isArchived:
          type: boolean
          readOnly: true
          description: True when the contract is archived. Archiving does not change the contract lifecycle status.
          examples:
          - false
      examples:
      - id: 201
        customerId: 101
        contractNumber: CTR-1001
        title: Banking Integration Project
        description: Development and integration of a banking payment solution.
        startDate: '2026-09-01'
        expirationDate: '2027-03-01'
        contractValue: 25000.0
        billingFrequency: monthly
        status: active
        createdAt: '2026-09-01T13:30:00Z'
        updatedAt: '2026-09-01T14:45:00Z'
        isArchived: false
    CreateContractRequest:
      type: object
      additionalProperties: false
      required:
