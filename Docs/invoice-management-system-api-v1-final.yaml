  /invoices/{invoiceId}/payments:
    post:
      tags:
      - Payments
      summary: Record invoice payment
      operationId: createInvoicePayment
      description: 'Records a payment against an existing invoice.


        Related Functional Requirements:

        - FR-046: Record a payment with invoice, amount, payment date, and payment method.

        - FR-047: Support partial payments.

        - FR-048: Calculate the remaining balance and reject overpayment.

        - FR-049: Mark the invoice as paid when the remaining balance reaches zero.


        Business rules:

        - The invoice must exist and belong to the authenticated business.

        - Payment amount must be greater than zero.

        - Payment amount cannot exceed the invoice''s current remaining balance.

        - Partial payments are allowed.

        - Payments cannot be recorded against draft, cancelled, void, or fully paid invoices.

        - After recording a payment, paid amount and remaining balance are recalculated.

        - If remaining balance is greater than zero, the invoice becomes partially_paid.

        - If remaining balance becomes zero, the invoice becomes paid.

        - A successful payment may trigger the configured payment_received administrator notification.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice receiving the payment.
        schema:
          type: integer
          format: int64
        examples:
          invoice:
            value: 301
      requestBody:
        required: true
        description: Payment information to record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              bankTransfer:
                summary: Partial payment by bank transfer
                value:
                  amount: 500.0
                  paymentDate: '2026-09-02'
                  method: bank_transfer
              fullPayment:
                summary: Payment covering the complete remaining balance
                value:
                  amount: 1498.5
                  paymentDate: '2026-09-02'
                  method: card
      responses:
        '201':
          description: Payment recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                partialPaymentRecorded:
                  value:
                    data:
                      id: 501
                      invoiceId: 301
                      amount: 500.0
                      paymentDate: '2026-09-02'
                      method: bank_transfer
                      createdAt: '2026-09-02T08:30:00Z'
                    invoice:
                      total: 1498.5
                      paidAmount: 500.0
                      remainingBalance: 998.5
                      status: partially_paid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invoiceNotFound:
                  value:
                    status: 404
                    code: INVOICE_NOT_FOUND
                    message: Invoice was not found.
        '409':
          description: Payment cannot be recorded against the invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                overpayment:
                  value:
                    status: 409
                    code: PAYMENT_EXCEEDS_REMAINING_BALANCE
                    message: Payment amount cannot exceed the invoice remaining balance.
                invoiceAlreadyPaid:
                  value:
                    status: 409
                    code: INVOICE_ALREADY_PAID
                    message: Payment cannot be recorded because the invoice is already fully paid.
                invoiceNotPayable:
                  value:
                    status: 409
                    code: INVOICE_NOT_PAYABLE
                    message: Payment cannot be recorded against this invoice.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
