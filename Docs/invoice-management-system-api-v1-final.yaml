      tags:
      - Invoices
      summary: Generate invoice PDF
      operationId: getInvoicePdf
      description: 'Generates and returns the invoice PDF.


        Related Functional Requirement:

        - FR-035: Generate a PDF containing business details, customer details, invoice number and dates, line items, subtotal,
        discount, tax, total, and remaining balance.


        Business rules:

        - PDF content is generated from persisted invoice information.

        - Business identity and logo come from business settings.

        - The invoice''s stored financial values are used.

        - The PDF is generated as an artifact and is not represented as a separate database entity.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice.
        schema:
          type: integer
          format: int64
        examples:
          invoice:
            value: 301
      responses:
        '200':
          description: Invoice PDF generated successfully.
          headers:
            Content-Disposition:
              description: Suggested PDF filename.
              schema:
                type: string
                examples:
                - attachment; filename="INV-1001.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /invoices/{invoiceId}/send:
    post:
      tags:
      - Invoices
      summary: Send invoice to customer
      operationId: sendInvoice
      description: 'Sends an issued invoice to the customer''s registered email address with the invoice PDF attached.


        Related Functional Requirements:

        - FR-036: Send an issued invoice by email with the PDF attached.

        - FR-037: Record the delivery date/time and delivery status.


        Business rules:

        - Only issued invoices can be sent.

        - The recipient is the customer''s registered email address.

        - The generated invoice PDF is attached to the email.

        - Every send attempt creates an invoice delivery record.

        - Successful and failed delivery attempts are preserved.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: invoiceId
        in: path
        required: true
        description: Unique identifier of the invoice to send.
        schema:
          type: integer
          format: int64
        examples:
          invoice:
            value: 301
      responses:
        '200':
          description: Invoice delivery attempt completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDeliveryResponse'
              examples:
