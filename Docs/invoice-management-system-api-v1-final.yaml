  responses:
    BadRequest:
      description: Request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            invalidEmail:
              summary: Invalid email address
              value:
                status: 400
                code: VALIDATION_ERROR
                message: The request contains invalid data.
                errors:
                - field: email
                  message: A valid email address is required.
    Unauthorized:
      description: 'Authentication is required or the supplied access token

        is missing, invalid, or expired.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingAuthentication:
              summary: Authentication required
              value:
                status: 401
                code: UNAUTHORIZED
                message: Authentication required.
            expiredAccessToken:
              summary: Access token expired
              value:
                status: 401
                code: ACCESS_TOKEN_EXPIRED
                message: Access token has expired.
    Forbidden:
      description: 'The authenticated administrator does not have permission

        to perform the requested operation.


        The API remains RBAC-ready even though V1 currently uses

        a single Administrator role.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficientPermission:
              summary: Permission denied
              value:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this operation.
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resourceNotFound:
              summary: Resource not found
              value:
                status: 404
                code: RESOURCE_NOT_FOUND
                message: The requested resource was not found.
    Conflict:
      description: 'The request cannot be completed because it conflicts with

        the current state of the resource.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resourceConflict:
              summary: Resource-state conflict
              value:
                status: 409
                code: RESOURCE_CONFLICT
                message: The operation conflicts with the current resource state.
    InternalServerError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unexpectedError:
              summary: Unexpected server error
              value:
                status: 500
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred.
