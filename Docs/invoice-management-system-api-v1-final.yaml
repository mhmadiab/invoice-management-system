openapi: 3.1.0
info:
  title: Invoice Management System API
  version: 1.0.0-oas3.1
  description: 'REST API for the Invoice Management System.


    Authentication architecture:

    - Short-lived JWT access tokens.

    - Server-side refresh sessions.

    - Secure HttpOnly refresh-token cookies.

    - Session revocation on logout.

    - 30-minute inactivity timeout.

    - Administrator passwords stored using bcrypt.



    API design note:

    This document combines the Swagger/OpenAPI modules designed so far: Authentication, Customers, Contracts, Invoices, Payments,
    Reminders, Dashboard, Reports, Settings, and Administrator Notifications.

    Deletion policy: V1 does not expose hard-delete operations for business and financial resources. Historical records must
    be preserved for traceability and financial consistency.'
servers:
- url: http://localhost:3000/api/v1
  description: Local development server
tags:
- name: Authentication
  description: Administrator authentication and session management.
- name: Customers
  description: Customer creation, retrieval, modification, archiving, unarchiving, searching, and invoice history.
- name: Contracts
  description: Contract creation, retrieval, modification, lifecycle filtering, archiving, unarchiving, and customer contract
    history.
- name: Invoices
  description: Invoice draft creation, retrieval, modification, issuing, cancellation, voiding, PDF generation, delivery,
    searching, and filtering.
- name: Payments
  description: Payment recording, invoice payment history, balance tracking, and payment reporting.
- name: Reminders
  description: Reminder configuration, automated customer reminders, and invoice reminder history.
- name: Dashboard
  description: Aggregated business metrics, overdue invoices, upcoming due invoices, and recent business activity.
- name: Reports
  description: Read-only financial reporting for invoices, payments, outstanding balances, overdue amounts, and customer balances.
- name: Settings
  description: Business profile, invoice configuration, notification preferences, and email template management.
- name: Notifications
  description: Administrator notification history generated by critical invoice, payment, and contract events.
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate administrator
      operationId: loginAdministrator
      description: "Authenticates an administrator using a registered email address\nand password.\n\nRelated Functional Requirements:\n\
        - FR-001: Administrator can log in using registered email/password.\n- FR-002: Invalid credentials return a generic\
        \ response.\n- FR-003: Account is locked after 5 consecutive failed login attempts\n  for 15 minutes.\n\nSecurity\
        \ and business rules:\n- The password is compared with its stored bcrypt hash.\n- The response must not reveal whether\
        \ the email or password was wrong.\n- Failed login attempts are tracked.\n- Successful authentication resets the failed-attempt\
        \ counter.\n- A successful login creates a server-side refresh session.\n- The access token is intentionally short-lived.\n\
        - The refresh token is not exposed in the JSON response.\n- The refresh token is stored in a Secure HttpOnly cookie.\n"
      security: []
      requestBody:
        required: true
        description: Administrator authentication credentials.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              validLogin:
                summary: Valid administrator credentials
                value:
                  email: admin@example.com
                  password: StrongPassword123!
      responses:
        '200':
          description: Administrator authenticated successfully.
          headers:
            Set-Cookie:
              description: 'Stores the refresh token in a Secure HttpOnly cookie.


                Recommended cookie configuration:

                - HttpOnly

                - Secure

                - SameSite=Strict

                - Path=/api/v1/auth

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                successfulLogin:
                  summary: Successful administrator login
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
                    administrator:
                      id: 1
                      email: admin@example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication failed because the credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  summary: Invalid email or password
                  value:
                    status: 401
                    code: INVALID_CREDENTIALS
                    message: Invalid email or password.
        '423':
          description: 'The administrator account is temporarily locked because

            five consecutive failed login attempts were reached.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountLocked:
                  summary: Account temporarily locked
                  value:
                    status: 423
                    code: ACCOUNT_LOCKED
                    message: Account temporarily locked. Try again later.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh access token
      operationId: refreshAccessToken
      description: 'Issues a new short-lived JWT access token using the current

        refresh session.


        This endpoint is an implementation requirement of the selected

        JWT + refresh-session authentication architecture.


        The refresh token is expected to be stored in a Secure HttpOnly

        cookie and therefore is not supplied in the JSON request body.


        Before issuing a new access token, the server validates:

        - The refresh token.

        - The associated server-side session.

        - Whether the session has been revoked.

        - Whether the session has expired.

        - Whether the 30-minute inactivity timeout has been exceeded.

        - Whether the administrator still exists and is allowed to authenticate.

        '
      security: []
      responses:
        '200':
          description: A new access token was issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
              examples:
                refreshedAccessToken:
                  summary: Successfully refreshed access token
                  value:
                    accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    tokenType: Bearer
                    expiresIn: 900
        '401':
          description: 'The refresh token or associated authentication session

            is invalid, revoked, expired, or inactive.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSession:
                  summary: Invalid or revoked session
                  value:
                    status: 401
                    code: INVALID_SESSION
                    message: Authentication session is invalid or expired.
                sessionExpired:
                  summary: Session expired after inactivity
                  value:
                    status: 401
                    code: SESSION_EXPIRED
                    message: Authentication session is invalid or expired.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out current administrator
      operationId: logoutAdministrator
      description: 'Logs out the currently authenticated administrator.


        Related Functional Requirement:

        - FR-004: Logout invalidates the current session/token.


        Logout processing:

        - The server identifies the current authenticated session.

        - The server revokes the refresh session.

        - The refresh-token cookie is cleared.

        - The revoked refresh session can no longer issue access tokens.


        Existing short-lived access tokens may remain cryptographically valid

        until expiration unless access-token revocation is implemented

        separately. The server-side refresh session prevents creation of

        additional tokens after logout.

        '
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Administrator logged out successfully.
          headers:
            Set-Cookie:
              description: 'Clears the refresh-token cookie.

                '
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers:
    post:
      tags:
      - Customers
      summary: Create customer
      operationId: createCustomer
      description: "Creates a new customer for the authenticated business.\n\nRelated Functional Requirement:\n- FR-012: Create\
        \ a customer with name, email, phone, and\n  billing address.\n- Customer name and email are required.\n- Duplicate\
        \ customer email addresses are rejected.\n\nBusiness rules:\n- The customer is automatically associated with the\n\
        \  authenticated administrator's business.\n- A newly created customer has status `active`.\n- Customer email must\
        \ be unique within the business.\n- Name cannot be empty.\n- Email must be a valid email address.\n- Phone and billing\
        \ address are optional.\n"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Customer information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              individualCustomer:
                summary: Create an individual customer
                value:
                  name: John Smith
                  email: john.smith@example.com
                  phone: '+96170123456'
                  billingAddress: Beirut, Lebanon
                  type: individual
              organizationCustomer:
                summary: Create an organization customer
                value:
                  name: Example Technology SAL
                  email: accounting@example.com
                  phone: '+9611123456'
                  billingAddress: Beirut Digital District, Beirut, Lebanon
                  type: organization
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customerCreated:
                  summary: Successfully created customer
                  value:
                    data:
                      id: 101
                      name: John Smith
                      email: john.smith@example.com
                      phone: '+96170123456'
                      billingAddress: Beirut, Lebanon
                      type: individual
                      status: active
                      createdAt: '2026-09-01T10:30:00Z'
                      updatedAt: '2026-09-01T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A customer with the supplied email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateCustomerEmail:
                  summary: Duplicate customer email
                  value:
                    status: 409
                    code: CUSTOMER_EMAIL_ALREADY_EXISTS
                    message: A customer with this email already exists.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Customers
      summary: List customers
      operationId: listCustomers
      description: "Returns customers belonging to the authenticated business.\n\nRelated Functional Requirements:\n- FR-016:\
        \ Search customers by name using a\n  case-insensitive contains search.\n- FR-017: Filter customers by active or archived\
        \ status.\n\nThe endpoint supports pagination, searching, and status filtering.\n"
      security:
      - bearerAuth: []
      parameters:
      - name: search
        in: query
        required: false
        description: 'Case-insensitive customer name search.

          Customers whose names contain the supplied value are returned.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 200
        examples:
          searchByName:
            value: John
      - name: status
        in: query
        required: false
        description: Filter customers by status.
        schema:
          $ref: '#/components/schemas/CustomerStatus'
        examples:
          activeCustomers:
            value: active
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of customers returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      responses:
        '200':
          description: Customers retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
              examples:
                customerList:
                  summary: Paginated customer list
                  value:
                    data:
                    - id: 101
                      name: John Smith
                      email: john.smith@example.com
                      phone: '+96170123456'
                      billingAddress: Beirut, Lebanon
                      type: individual
                      status: active
                      createdAt: '2026-09-01T10:30:00Z'
                      updatedAt: '2026-09-01T10:30:00Z'
                    - id: 102
                      name: Example Technology SAL
                      email: accounting@example.com
                      phone: '+9611123456'
                      billingAddress: Beirut Digital District, Beirut, Lebanon
                      type: organization
                      status: active
                      createdAt: '2026-08-15T08:15:00Z'
                      updatedAt: '2026-08-20T12:45:00Z'
                    pagination:
                      page: 1
                      pageSize: 20
                      totalItems: 2
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}:
    parameters:
    - name: customerId
      in: path
      required: true
      description: Unique identifier of the customer.
      schema:
        type: integer
        format: int64
      examples:
        customerId:
          value: 101
    get:
      tags:
      - Customers
      summary: Get customer details
      operationId: getCustomerById
      description: 'Returns the details of a specific customer belonging to

        the authenticated business.


        This is a supporting API required by the customer detail

        view and by other workflows that reference a customer.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Customer retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customer:
                  value:
                    data:
                      id: 101
                      name: John Smith
                      email: john.smith@example.com
                      phone: '+96170123456'
                      billingAddress: Beirut, Lebanon
                      type: individual
                      status: active
                      createdAt: '2026-09-01T10:30:00Z'
                      updatedAt: '2026-09-01T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
                    message: Customer was not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Customers
      summary: Update customer
      operationId: updateCustomer
      description: "Updates an existing customer's information.\n\nRelated Functional Requirement:\n- FR-013: Update customer\
        \ name, email, phone, and\n  billing address using the same validation rules as creation.\n\nBusiness rules:\n- Only\
        \ supplied fields are modified.\n- The customer must belong to the authenticated business.\n- Name cannot be empty\
        \ when supplied.\n- Email must be valid when supplied.\n- Updated email must not conflict with another customer.\n\
        - Customer status is not modified through this endpoint.\n- Archiving is handled through the dedicated archive operation.\n"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Fields that should be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
            examples:
              updateContactInformation:
                summary: Update phone and billing address
                value:
                  phone: '+96170987654'
                  billingAddress: Hamra, Beirut, Lebanon
              updateEmail:
                summary: Update customer email
                value:
                  email: new.email@example.com
      responses:
        '200':
          description: Customer updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customerUpdated:
                  value:
                    data:
                      id: 101
                      name: John Smith
                      email: new.email@example.com
                      phone: '+96170987654'
                      billingAddress: Hamra, Beirut, Lebanon
                      type: individual
                      status: active
                      createdAt: '2026-09-01T10:30:00Z'
                      updatedAt: '2026-09-01T12:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
                    message: Customer was not found.
        '409':
          description: Updated customer data conflicts with an existing customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateCustomerEmail:
                  value:
                    status: 409
                    code: CUSTOMER_EMAIL_ALREADY_EXISTS
                    message: A customer with this email already exists.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}/archive:
    post:
      tags:
      - Customers
      summary: Archive customer
      operationId: archiveCustomer
      description: "Archives an active customer without deleting historical data.\n\nRelated Functional Requirements:\n- FR-014:\
        \ Archived customers are excluded from active customer\n  selection and active customer counts while preserving history.\n\
        - FR-015: A customer with active unpaid invoices cannot be archived.\n\nBusiness rules:\n- The customer must belong\
        \ to the authenticated business.\n- Archiving is a state transition, not deletion.\n- Customer invoices, contracts,\
        \ payments, and historical data\n  are preserved.\n- Customers with active unpaid invoices cannot be archived.\n-\
        \ Archived customers are excluded from active customer selections.\n"
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer to archive.
        schema:
          type: integer
          format: int64
        examples:
          customerId:
            value: 101
      responses:
        '200':
          description: Customer archived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customerArchived:
                  value:
                    data:
                      id: 101
                      name: John Smith
                      email: john.smith@example.com
                      phone: '+96170123456'
                      billingAddress: Beirut, Lebanon
                      type: individual
                      status: archived
                      createdAt: '2026-08-01T09:00:00Z'
                      updatedAt: '2026-09-01T13:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
                    message: Customer was not found.
        '409':
          description: Customer cannot currently be archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unpaidInvoices:
                  summary: Customer has active unpaid invoices
                  value:
                    status: 409
                    code: CUSTOMER_HAS_UNPAID_INVOICES
                    message: Customer cannot be archived while active unpaid invoices exist.
                alreadyArchived:
                  summary: Customer is already archived
                  value:
                    status: 409
                    code: CUSTOMER_ALREADY_ARCHIVED
                    message: Customer is already archived.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/{customerId}/invoices:
    get:
      tags:
      - Customers
      summary: Get customer invoices
      operationId: getCustomerInvoices
      description: 'Returns invoices associated with a specific customer.


        Related Functional Requirement:

        - FR-018: Display all invoices associated with a customer.


        Historical invoices remain available even when the customer

        has been archived.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: Unique identifier of the customer.
        schema:
          type: integer
          format: int64
        examples:
          customerId:
            value: 101
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of invoices returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      responses:
        '200':
          description: Customer invoices retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInvoiceListResponse'
              examples:
                invoices:
                  value:
                    data:
                    - id: 301
                      invoiceNumber: INV-1001
                      issueDate: '2026-08-15'
                      dueDate: '2026-09-15'
                      status: issued
                      total: 1500.0
                      remainingBalance: 1500.0
                      isOverdue: false
                      daysOverdue: 0
                    - id: 302
                      invoiceNumber: INV-1000
                      issueDate: '2026-07-10'
                      dueDate: '2026-08-10'
                      status: paid
                      total: 800.0
                      remainingBalance: 0.0
                      isOverdue: false
                      daysOverdue: 0
                    pagination:
                      page: 1
                      pageSize: 20
                      totalItems: 2
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
                    message: Customer was not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contracts:
    post:
      tags:
      - Contracts
      summary: Create contract
      operationId: createContract
      description: "Creates a contract for a selected customer.\n\nRelated Functional Requirements:\n- FR-019: Create a contract\
        \ with title, start date,\n  expiration date, contract value, and billing frequency.\n- FR-022: Every contract belongs\
        \ to exactly one customer.\n\nBusiness rules:\n- The customer must belong to the authenticated business.\n- Each contract\
        \ is associated with exactly one customer.\n- The contract title is required.\n- Start date and expiration date are\
        \ required.\n- Expiration date must be after the start date.\n- Contract value must not be negative.\n- Billing frequency\
        \ is required.\n- A newly created contract starts with `draft` status.\n- Contract number is generated by the server.\n\
        - The contract is automatically associated with the\n  authenticated administrator's business.\n"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: Contract information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
            examples:
              softwareDevelopmentContract:
                summary: Software development contract
                value:
                  customerId: 101
                  title: Banking Integration Project
                  description: Development and integration of a banking payment solution.
                  startDate: '2026-09-01'
                  expirationDate: '2027-03-01'
                  contractValue: 25000.0
                  billingFrequency: monthly
      responses:
        '201':
          description: Contract created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
              examples:
                contractCreated:
                  summary: Successfully created contract
                  value:
                    data:
                      id: 201
                      customerId: 101
                      contractNumber: CTR-1001
                      title: Banking Integration Project
                      description: Development and integration of a banking payment solution.
                      startDate: '2026-09-01'
                      expirationDate: '2027-03-01'
                      contractValue: 25000.0
                      billingFrequency: monthly
                      status: draft
                      createdAt: '2026-09-01T13:30:00Z'
                      updatedAt: '2026-09-01T13:30:00Z'
                      isArchived: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Selected customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customerNotFound:
                  value:
                    status: 404
                    code: CUSTOMER_NOT_FOUND
                    message: Customer was not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Contracts
      summary: List contracts
      operationId: listContracts
      description: 'Returns contracts belonging to the authenticated business.


        Contracts can be filtered independently by customer, lifecycle status, and archive state.

        By default archived contracts are excluded. Use `archived=true` to return archived contracts.'
      security:
      - bearerAuth: []
      parameters:
      - name: customerId
        in: query
        required: false
        description: Return contracts belonging to a specific customer.
        schema:
          type: integer
          format: int64
        examples:
          customer:
            value: 101
      - name: status
        in: query
        required: false
        description: Filter contracts by lifecycle status.
        schema:
          $ref: '#/components/schemas/ContractStatus'
        examples:
          activeContracts:
            value: active
      - name: archived
        in: query
        required: false
        description: Filter by archive state. Defaults to false so archived contracts are excluded from active contract lists.
        schema:
          type: boolean
          default: false
        examples:
          archivedContracts:
            value: true
      - name: page
        in: query
        required: false
        description: Page number to retrieve.
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          firstPage:
            value: 1
      - name: pageSize
        in: query
        required: false
        description: Number of contracts returned per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        examples:
          standardPage:
            value: 20
      responses:
        '200':
          description: Contracts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListResponse'
              examples:
                contractList:
                  value:
                    data:
                    - id: 201
                      customerId: 101
                      contractNumber: CTR-1001
                      title: Banking Integration Project
