    InvoiceStatus:
      type: string
      description: 'Current invoice lifecycle/payment status.


        - `draft`: Invoice is being prepared.

        - `issued`: Invoice has been finalized and issued and no payment has been recorded.

        - `partially_paid`: At least one payment has been recorded, but a balance remains.

        - `paid`: Remaining balance is zero.

        - `cancelled`: Invoice was cancelled and is excluded from outstanding balances and reminders.

        - `void`: Invoice was invalidated because it was created or issued in error.


        Overdue is not a lifecycle status. It is derived when the due date has passed, remaining balance is greater than zero,
        and status is not cancelled or void.'
      enum:
      - draft
      - issued
      - partially_paid
      - paid
      - cancelled
      - void
      examples:
      - issued
    DiscountType:
      type: string
      description: Type of discount applied before tax.
      enum:
      - percentage
      - fixed
      examples:
      - percentage
    DeliveryStatus:
